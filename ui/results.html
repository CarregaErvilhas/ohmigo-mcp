<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Charging costs</title>
<style>
  :root {
    --bg: var(--color-background-primary, #fff);
    --fg: var(--color-text-primary, #1a1a1a);
    --muted: var(--color-text-secondary, #666);
    --line: var(--color-border-primary, #e3e3e3);
    --accent: #1f7a4d;
    --font: var(--font-sans, system-ui, -apple-system, "Segoe UI", sans-serif);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: var(--color-background-primary, #1c1c1c); --fg: var(--color-text-primary, #eee);
      --muted: var(--color-text-secondary, #aaa); --line: var(--color-border-primary, #333); --accent: #5fcf95;
    }
  }
  :root[data-theme="dark"] {
    --bg: var(--color-background-primary, #1c1c1c); --fg: var(--color-text-primary, #eee);
    --muted: var(--color-text-secondary, #aaa); --line: var(--color-border-primary, #333); --accent: #5fcf95;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 12px; background: var(--bg); color: var(--fg); font: 14px/1.4 var(--font); }
  .row { display: grid; grid-template-columns: 28px 1fr auto; gap: 4px 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .n { color: var(--muted); font-variant-numeric: tabular-nums; }
  .where { font-weight: 600; overflow-wrap: anywhere; }
  .sub { color: var(--muted); font-size: 12.5px; grid-column: 2 / 4; }
  .eur { font-weight: 700; font-size: 17px; text-align: right; font-variant-numeric: tabular-nums; }
  .eur small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
  .best .eur { color: var(--accent); }
  details { grid-column: 2 / 4; font-size: 12.5px; }
  summary { cursor: pointer; color: var(--muted); }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 6px 0; }
  dt { color: var(--muted); }
  dd { margin: 0; }
  button { font: inherit; font-size: 12.5px; padding: 3px 10px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--fg); cursor: pointer; margin-top: 4px; }
  .opts { grid-column: 2 / 4; list-style: none; margin: 4px 0 0; padding: 0; font-size: 12.5px; }
  .opts li { padding: 1px 0; color: var(--muted); }
  .opts li span { display: inline-block; min-width: 64px; font-variant-numeric: tabular-nums; color: var(--fg); }
  .opts li.hl span { font-weight: 700; }
  .opts em { font-style: normal; font-size: 11px; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
  .foot { color: var(--muted); font-size: 11.5px; margin-top: 8px; }
  .empty { color: var(--muted); padding: 12px 0; }
  .sec { color: var(--muted); font-size: 12px; font-weight: 600; padding: 14px 0 2px; }
  .st { font-weight: 600; }
  .st-available { color: var(--accent); }
  .st-charging, .st-outOfOrder, .st-inoperative, .st-blocked { color: #c0392b; }
</style>
</head>
<body>
<div id="list" class="empty">Waiting for results…</div>
<div id="foot" class="foot"></div>
<script>/*__BRIDGE__*/</script>
<script>
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const eur = v => v == null ? 'n/a' : v.toFixed(2).replace('.', ',') + ' €';
  const STATUS = { available: 'Available', charging: 'In use', outOfOrder: 'Out of order', inoperative: 'Out of order', blocked: 'Blocked', unknown: 'Status unknown', planned: 'Planned' };
  const app = new McpApps.App({ name: 'ohmigo-results', version: '0.1.0' });

  function render(data) {
    const list = document.getElementById('list');
    const rows = [...(data?.results || []), ...(data?.outsideMobie || []).map(q => ({ ...q, outside: true }))];
    if (!rows.length) { list.className = 'empty'; list.textContent = 'No results.'; return; }
    list.className = '';
    list.innerHTML = rows.map((q, i) => {
      const range = q.total && q.total.low !== q.total.high ? `${eur(q.total.low)}–${eur(q.total.high)}` : '';
      const dist = q.km != null ? `${q.km.toFixed(1)} km away` : q.alongKm != null ? `km ${Math.round(q.alongKm)} of route, ${q.offRouteKm.toFixed(1)} km off` : '';
      const h = q.headline;
      const optName = o => o.kind === 'adhoc' ? 'Card / QR at charger' : o.kind === 'opc_direct' ? 'Operator direct' : `${o.ceme} ${o.name}`;
      const opts = (q.options || []).map(o => `<li class="${o === q.options[0] && !q.outside ? 'hl' : ''}"><span>${eur(o.total)}${o.asterisk ? '*' : ''}</span> ${esc(optName(o))}${o.requiresOtherContract ? ' <em>needs another contract</em>' : ''}${o.cheaperElsewhere ? ' <em>cheapest overall</em>' : ''}</li>`).join('');
      const head = q.outside && !rows[i - 1]?.outside ? '<div class="sec">Outside MOBI.E: pay the operator directly, price not comparable *</div>' : '';
      return `${head}<div class="row${i === 0 && q.total ? ' best' : ''}">
        <div class="n">${i + 1}</div>
        <div class="where">${esc(q.operator)}<br><span style="font-weight:400">${esc(q.address)}${q.city ? ', ' + esc(q.city) : ''}</span></div>
        <div class="eur">${q.total?.asterisk ? '' : q.total && !q.total.complete ? '≥ ' : ''}${eur(q.total?.eur)}${q.total?.asterisk ? '*' : ''}<small>${q.session.minutes} min</small></div>
        <div class="sub">${q.status ? `<span class="st st-${esc(q.status)}">${esc(STATUS[q.status] || q.status)}</span> · ` : ''}${esc(q.kw)} kW ${esc(q.connector)}${q.dc ? ' DC' : ' AC'} · ${q.session.kwhBilled} kWh · ${esc(dist)}${range ? ' · range ' + range : ''}</div>
        ${opts ? `<ul class="opts">${opts}</ul>` : ''}
        <details><summary>Breakdown</summary><dl>
          ${h ? `<dt>Energy</dt><dd>${eur(h.energyEur)} · ${esc(h.ceme)} ${esc(h.name)}</dd>` : ''}
          ${q.opc ? `<dt>Operator</dt><dd>${eur(q.opc.eurWithVat)} · ${esc(q.opc.tariff ?? 'not published')}</dd>` : ''}
          ${(q.options || []).filter(o => o.kind !== 'ceme').map(o => `<dt>${o.kind === 'adhoc' ? 'Card / QR' : 'Direct'}</dt><dd>${o.tariff ? esc(o.tariff) + ' · ' : ''}${esc(o.note || '')}</dd>`).join('')}
          ${q.note ? `<dt>Note</dt><dd>${esc(q.note)}</dd>` : ''}
          <dt>Assumes</dt><dd>${(q.assumptions || []).map(esc).join('; ')}</dd>
          <dt>Point</dt><dd>${esc(q.pointId)}</dd>
        </dl>
        <button data-lat="${q.lat}" data-lon="${q.lon}">Directions</button></details>
      </div>`;
    }).join('');
    const lv = data.live || {};
    const at = lv.publishedAt ? new Date(lv.publishedAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : null;
    document.getElementById('foot').textContent = 'Estimates. '
      + (at ? `Status from MOBI.E at ${at}${lv.fresh ? '' : ' (may be stale)'}.` : 'Live status unavailable.')
      + ` Chargers as of ${(data.dataAsOf || '').slice(0, 10)}.`;
  }

  document.addEventListener('click', e => {
    const b = e.target.closest('button[data-lat]');
    if (b) app.openLink({ url: `https://www.google.com/maps/dir/?api=1&destination=${b.dataset.lat},${b.dataset.lon}` });
  });
  app.ontoolresult = r => render(r.structuredContent);
  app.onhostcontextchanged = ctx => { if (ctx.theme) document.documentElement.dataset.theme = ctx.theme; };
  app.connect().then(() => {
    const ctx = app.getHostContext();
    if (ctx?.theme) document.documentElement.dataset.theme = ctx.theme;
  });
</script>
</body>
</html>
