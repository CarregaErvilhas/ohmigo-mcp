<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Charging costs</title>
<style>
  :root {
    --bg: var(--color-background-primary, #fff);
    --fg: var(--color-text-primary, #1a1a1a);
    --muted: var(--color-text-secondary, #666);
    --line: var(--color-border-primary, #e3e3e3);
    --accent: #1f7a4d;
    --font: var(--font-sans, system-ui, -apple-system, "Segoe UI", sans-serif);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: var(--color-background-primary, #1c1c1c); --fg: var(--color-text-primary, #eee);
      --muted: var(--color-text-secondary, #aaa); --line: var(--color-border-primary, #333); --accent: #5fcf95;
    }
  }
  :root[data-theme="dark"] {
    --bg: var(--color-background-primary, #1c1c1c); --fg: var(--color-text-primary, #eee);
    --muted: var(--color-text-secondary, #aaa); --line: var(--color-border-primary, #333); --accent: #5fcf95;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 12px; background: var(--bg); color: var(--fg); font: 14px/1.4 var(--font); }
  .row { display: grid; grid-template-columns: 28px 1fr auto; gap: 4px 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .n { color: var(--muted); font-variant-numeric: tabular-nums; }
  .where { font-weight: 600; overflow-wrap: anywhere; }
  .sub { color: var(--muted); font-size: 12.5px; grid-column: 2 / 4; }
  .eur { font-weight: 700; font-size: 17px; text-align: right; font-variant-numeric: tabular-nums; }
  .eur small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
  .best .eur { color: var(--accent); }
  details { grid-column: 2 / 4; font-size: 12.5px; }
  summary { cursor: pointer; color: var(--muted); }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 6px 0; }
  dt { color: var(--muted); }
  dd { margin: 0; }
  button { font: inherit; font-size: 12.5px; padding: 3px 10px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--fg); cursor: pointer; margin-top: 4px; }
  .opts { grid-column: 2 / 4; list-style: none; margin: 4px 0 0; padding: 0; font-size: 12.5px; }
  .opts li { padding: 1px 0; color: var(--muted); }
  .opts li span { display: inline-block; min-width: 64px; font-variant-numeric: tabular-nums; color: var(--fg); }
  .opts li.hl span { font-weight: 700; }
  .opts em { font-style: normal; font-size: 11px; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
  .foot { color: var(--muted); font-size: 11.5px; margin-top: 8px; }
  .empty { color: var(--muted); padding: 12px 0; }
  .sec { color: var(--muted); font-size: 12px; font-weight: 600; padding: 14px 0 2px; }
  .st { font-weight: 600; }
  .st-available { color: var(--accent); }
  .st-charging, .st-outOfOrder, .st-inoperative, .st-blocked { color: #c0392b; }
</style>
</head>
<body>
<div id="list" class="empty"></div>
<div id="foot" class="foot"></div>
<script>/*__BRIDGE__*/</script>
<script>
  // The results view. The host (ChatGPT, Claude...) loads this page in a
  // sandboxed iframe and hands it the tool's structuredContent through the
  // MCP Apps bridge (McpApps.App, inlined above by src/view.js). Everything
  // here is display only: no network calls, no state.
  //
  // Language: the server says which one it answered in (data.lang); before
  // the first result we go by the host's locale. Fixed text lives in STR,
  // one table per language, like src/i18n.js on the server.
  const STR = {
    en: {
      waiting: 'Waiting for results…', none: 'No results.', away: 'km away',
      route: (km, off) => `km ${km} of route, ${off} km off`, range: 'range',
      outside: 'Outside MOBI.E: pay the operator directly, price not comparable *',
      adhoc: 'Card / QR at charger', direct: 'Operator direct', contract: 'needs another contract', cheapest: 'cheapest overall',
      sub: 'subscription', promo: 'promotion', promos: 'Promotions', breakdown: 'Breakdown', energy: 'Energy', operator: 'Operator', notPublished: 'not published',
      cardQr: 'Card / QR', own: 'Direct', note: 'Note', assumes: 'Assumes', point: 'Point', directions: 'Directions',
      period: { VAZIO: 'off-peak', FORA_VAZIO: 'peak', UNICO: 'flat' }, timeline: 'Quarter by quarter',
      foot: (at, stale, day) => `Estimates. ${at ? `Status from the NAP at ${at}${stale ? ' (may be stale)' : ''}.` : 'Live status unavailable.'} Chargers as of ${day}.`,
      credit: 'Direct prices: Preços (finais) kWh Portugal, by Alexandre Moleiro (custofinal.blogspot.com).',
      status: { available: 'Available', charging: 'In use', outOfOrder: 'Out of order', inoperative: 'Out of order', blocked: 'Blocked', unknown: 'Status unknown', planned: 'Planned' },
    },
    pt: {
      waiting: 'À espera dos resultados…', none: 'Sem resultados.', away: 'km daqui',
      route: (km, off) => `km ${km} do percurso, a ${off} km`, range: 'intervalo',
      outside: 'Fora da MOBI.E: paga-se ao operador, preço não comparável *',
      adhoc: 'Cartão / QR no posto', direct: 'Operador directo', contract: 'exige outro contrato', cheapest: 'o mais barato',
      sub: 'subscrição', promo: 'promoção', promos: 'Promoções', breakdown: 'Detalhe', energy: 'Energia', operator: 'Operador', notPublished: 'não publicada',
      cardQr: 'Cartão / QR', own: 'Directo', note: 'Nota', assumes: 'Pressupostos', point: 'Ponto', directions: 'Direcções',
      period: { VAZIO: 'vazio', FORA_VAZIO: 'fora de vazio', UNICO: 'simples' }, timeline: 'Quarto a quarto',
      foot: (at, stale, day) => `Estimativas. ${at ? `Estado do PAN às ${at}${stale ? ' (pode estar desactualizado)' : ''}.` : 'Estado em tempo real indisponível.'} Postos de ${day}.`,
      credit: 'Preços directos: Preços (finais) kWh Portugal, de Alexandre Moleiro (custofinal.blogspot.com).',
      status: { available: 'Livre', charging: 'Ocupado', outOfOrder: 'Avariado', inoperative: 'Avariado', blocked: 'Bloqueado', unknown: 'Estado desconhecido', planned: 'Planeado' },
    },
  };
  let lang = 'en';
  const S = () => STR[lang];
  const setLang = l => { lang = String(l || '').toLowerCase().startsWith('pt') ? 'pt' : 'en'; document.documentElement.lang = lang; };

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const eur = v => v == null ? 'n/a' : v.toLocaleString(lang === 'pt' ? 'pt-PT' : 'en', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
  const km = v => v.toLocaleString(lang === 'pt' ? 'pt-PT' : 'en', { maximumFractionDigits: 1 });
  const app = new McpApps.App({ name: 'ohmigo-results', version: '0.1.0' });

  function optName(o) {
    if (o.kind === 'adhoc') return S().adhoc;
    if (o.kind === 'opc_direct') return S().direct;
    if (o.kind === 'direct') return o.label;
    return `${o.ceme} ${o.name}`;
  }

  function render(data) {
    if (data?.lang) setLang(data.lang);
    const s = S();
    const list = document.getElementById('list');
    const rows = [...(data?.results || []), ...(data?.outsideMobie || []).map(q => ({ ...q, outside: true }))];
    if (!rows.length) { list.className = 'empty'; list.textContent = s.none; return; }
    list.className = '';
    // Only when the tool was called with detail (or in QA): each quarter's
    // kWh, and the headline tariff's period and price (excl. VAT) in it.
    const timelineHtml = (q, h, s) => {
      const tl = q.timeline;
      if (!tl) return '';
      const per = (tl.tariffs.find(x => h && x.tariffId === h.tariffId) || tl.tariffs[0] || { slices: [] }).slices;
      const lines = tl.slices.map((x, i) => {
        const p = per[i];
        return `${esc(x.local)} ${km(x.kwh)} kWh${p ? ` · ${esc(s.period[p.period] || p.period)} ${esc(p.eurKwhExVat?.toFixed(4))} €/kWh${p.omieEurKwh != null ? ` (OMIE ${esc(p.omieEurKwh.toFixed(4))}${p.omieSpot ? '' : '~'})` : ''}` : ''}`;
      });
      return `<dt>${s.timeline}</dt><dd>${lines.join('<br>')}</dd>`;
    };
    list.innerHTML = rows.map((q, i) => {
      const range = q.total && q.total.low !== q.total.high ? `${eur(q.total.low)}–${eur(q.total.high)}` : '';
      const dist = q.km != null ? `${km(q.km)} ${s.away}` : q.alongKm != null ? s.route(Math.round(q.alongKm), km(q.offRouteKm)) : '';
      const h = q.headline;
      const opts = (q.options || []).map(o => `<li class="${q.best && o.kind === q.best.kind && o.label === q.best.label ? 'hl' : ''}"><span>${eur(o.total)}${o.asterisk ? '*' : ''}</span> ${esc(optName(o))}`
        + `${o.requiresOtherContract ? ` <em>${s.contract}</em>` : ''}${o.cheaperElsewhere ? ` <em>${s.cheapest}</em>` : ''}`
        + `${o.subscription ? ` <em>${esc(o.subscription.text)}</em>` : ''}${o.promos ? ` <em>${s.promo}</em>` : ''}</li>`).join('');
      const head = q.outside && !rows[i - 1]?.outside ? `<div class="sec">${s.outside}</div>` : '';
      return `${head}<div class="row${i === 0 && q.total ? ' best' : ''}">
        <div class="n">${i + 1}</div>
        <div class="where">${esc(q.operator)}<br><span style="font-weight:400">${esc(q.address)}${q.city ? ', ' + esc(q.city) : ''}</span></div>
        <div class="eur">${q.best ? eur(q.best.total) : (q.total?.asterisk ? '' : q.total ? '≥ ' : '') + eur(q.total?.eur) + (q.total?.asterisk ? '*' : '')}<small>${q.session.minutes} min${q.session.startLocal ? ` · ${esc(q.session.startLocal)}–${esc(q.session.endLocal)}` : ''}</small></div>
        <div class="sub">${q.status ? `<span class="st st-${esc(q.status)}">${esc(s.status[q.status] || q.status)}</span> · ` : ''}${esc(q.kw)} kW ${esc(q.connector)}${q.dc ? ' DC' : ' AC'} · ${km(q.session.kwhBilled)} kWh · ${esc(dist)}${range ? ` · ${s.range} ${range}` : ''}</div>
        ${opts ? `<ul class="opts">${opts}</ul>` : ''}
        <details><summary>${s.breakdown}</summary><dl>
          ${h ? `<dt>${s.energy}</dt><dd>${eur(h.energyEur)} · ${esc(h.ceme)} ${esc(h.name)}${h.kwhByPeriod ? ' · ' + Object.entries(h.kwhByPeriod).map(([p, k]) => `${km(k)} kWh ${esc(s.period[p] || p)}`).join(', ') : ''}</dd>` : ''}
          ${timelineHtml(q, h, s)}
          ${q.opc ? `<dt>${s.operator}</dt><dd>${eur(q.opc.eurWithVat)} · ${esc(q.opc.tariff ?? s.notPublished)}</dd>` : ''}
          ${(q.options || []).filter(o => o.kind === 'adhoc' || o.kind === 'opc_direct').map(o => `<dt>${o.kind === 'adhoc' ? s.cardQr : s.direct}</dt><dd>${o.tariff ? esc(o.tariff) + ' · ' : ''}${esc(o.note || '')}</dd>`).join('')}
          ${(q.options || []).find(o => o.kind === 'direct') ? `<dt>${s.own}</dt><dd>${esc(q.options.find(o => o.kind === 'direct').note)}</dd>` : ''}
          ${q.promos ? `<dt>${s.promos}</dt><dd>${q.promos.map(p => `${esc(p.label)}: ${eur(p.total)} · ${esc(p.note)}`).join('<br>')}</dd>` : ''}
          ${q.note ? `<dt>${s.note}</dt><dd>${esc(q.note)}</dd>` : ''}
          <dt>${s.assumes}</dt><dd>${(q.assumptions || []).map(esc).join('; ')}</dd>
          <dt>${s.point}</dt><dd>${esc(q.pointId)}</dd>
        </dl>
        <button data-lat="${q.lat}" data-lon="${q.lon}">${s.directions}</button></details>
      </div>`;
    }).join('');
    const lv = data.live || {};
    const at = lv.publishedAt ? new Date(lv.publishedAt).toLocaleTimeString(lang === 'pt' ? 'pt-PT' : 'en', { hour: '2-digit', minute: '2-digit' }) : null;
    document.getElementById('foot').textContent = s.foot(at, !lv.fresh, (data.dataAsOf || '').slice(0, 10))
      + (JSON.stringify(data).includes('"kind":"direct"') ? ' ' + s.credit : '');
  }

  document.addEventListener('click', e => {
    const b = e.target.closest('button[data-lat]');
    if (b) app.openLink({ url: `https://www.google.com/maps/dir/?api=1&destination=${b.dataset.lat},${b.dataset.lon}` });
  });
  function applyHost(ctx) {
    if (ctx?.theme) document.documentElement.dataset.theme = ctx.theme;
    if (ctx?.locale && lang === 'en') { setLang(ctx.locale); const w = document.getElementById('list'); if (w.className === 'empty') w.textContent = S().waiting; }
  }
  setLang(navigator.language);
  document.getElementById('list').textContent = S().waiting;
  app.ontoolresult = r => render(r.structuredContent);
  app.onhostcontextchanged = applyHost;
  app.connect().then(() => applyHost(app.getHostContext()));
</script>
</body>
</html>
