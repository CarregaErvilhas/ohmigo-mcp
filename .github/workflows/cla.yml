name: CLA

# Checks that every pull request author has signed CLA.md, with CLA Assistant
# Lite. Signing is a comment on the pull request with the exact sentence in
# CLA.md ("How to sign"); the action stores it in signatures/v1/cla.json on
# the cla-signatures branch, which the main ruleset doesn't cover.
#
# pull_request_target runs with write permissions even for pull requests from
# forks, so this workflow must never check out or run the pull request's code.
# The action doesn't.
#
# When CLA.md's terms change, bump the path to signatures/v2/cla.json: everyone
# is asked to sign the new version on their next pull request.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened, closed]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read CLA.md and I agree to it, for my past and future contributions to ohmigo.'))
    runs-on: ubuntu-latest
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/CarregaErvilhas/ohmigo-mcp/blob/main/CLA.md
          path-to-signatures: signatures/v1/cla.json
          branch: cla-signatures
          allowlist: FernandoMiguel,*[bot]
          custom-pr-sign-comment: I have read CLA.md and I agree to it, for my past and future contributions to ohmigo.
          custom-notsigned-prcomment: >-
            Thanks for contributing to ohmigo. Before this can be merged, please
            read the [Contributor License Agreement](https://github.com/CarregaErvilhas/ohmigo-mcp/blob/main/CLA.md)
            and sign it by commenting on this pull request with exactly the sentence below.
            You only sign once.
          custom-allsigned-prcomment: All contributors have signed the CLA. Thanks!
          lock-pullrequest-aftermerge: false
