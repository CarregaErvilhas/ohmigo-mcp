name: CLA

# Checks that every pull request author has signed CLA.md, with CLA Assistant
# Lite. Signing is a comment on the pull request with the exact sentence in
# CLA.md ("How to sign"); the action stores it in signatures/v1/cla.json on
# the cla-signatures branch, which the main ruleset doesn't cover. The steps
# live in OCarroEletrico so the group shares one copy (see docs/shared-ci.md
# there); the triggers, permissions and texts stay here.
#
# pull_request_target runs with write permissions even for pull requests from
# forks, so neither this workflow nor the shared one may check out or run the
# pull request's code.
#
# When CLA.md's terms change, bump the path to signatures/v2/cla.json: everyone
# is asked to sign the new version on their next pull request.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened, closed]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    uses: CarregaErvilhas/OCarroEletrico/.github/workflows/cla.yml@74ff022edf1f7bbaea86123d0ae6d8b3ef13cc54 # main
    with:
      document-url: https://github.com/CarregaErvilhas/ohmigo-mcp/blob/main/CLA.md
      sign-comment: I have read CLA.md and I agree to it, for my past and future contributions to ohmigo.
      notsigned-comment: >-
        Thanks for contributing to ohmigo. Before this can be merged, please
        read the [Contributor License Agreement](https://github.com/CarregaErvilhas/ohmigo-mcp/blob/main/CLA.md)
        and sign it by commenting on this pull request with exactly the sentence below.
        You only sign once.
      allsigned-comment: All contributors have signed the CLA. Thanks!
      allowlist: FernandoMiguel,*[bot]
      signatures-path: signatures/v1/cla.json
      branch: cla-signatures
