    "privacy.title": "Privacidade · ohmigo",
    "privacy.desc": "O que o ohmigo recebe quando o teu assistente o usa, o que guarda e a quem pedir o quê: sem contas, sem anúncios, sem cookies.",
    "privacy.h1": "Privacidade",
    "privacy.lede": "Sem contas, sem anúncios, sem cookies e sem base de dados de utilizadores. O ohmigo responde à pergunta e não a liga a ti.",

    "p1.h": "Quem é responsável",
    "p1.p": "O ohmigo é mantido pela comunidade d'<a href=\"https://ocarroeletrico.com/\" target=\"_blank\" rel=\"noopener\">O Carro Elétrico</a>. Para qualquer pedido sobre os teus dados, escreve para <a href=\"mailto:info@ocarroeletrico.com\">info@ocarroeletrico.com</a>.",

    "p2.h": "O que o ohmigo recebe",
    "p2.p1": "Quando o teu assistente (o ChatGPT, o Claude…) usa o ohmigo, envia os dados da pergunta: um sítio, umas coordenadas, um percurso ou o destino, a bateria do teu carro e a potência de carregamento, a percentagem de bateria, a hora de início, filtros (como a potência ou o tipo de ficha), os tarifários que usas, os kWh que já carregaste este mês em cada tarifário, se tens direito a um preço reservado a um público (colaboradores de uma empresa, motoristas Uber), as palavras de uma pesquisa (o nome de um operador ou de uma rua, por exemplo) e a língua da resposta. Só chega o que o assistente enviar. Se enviar a tua localização, o ohmigo recebe-a.",
    "p2.p2": "Estes dados servem só para calcular a resposta. Não os ligamos a ti, não vão para disco e não temos contas nem base de dados de utilizadores. Fica uma coisa na memória do servidor depois do pedido: para não repetir cálculos iguais, o ohmigo guarda as respostas do ceme-v2 junto com o que lhe perguntou (o perfil da sessão, a região e os kWh do mês por tarifário, ver abaixo). Reutiliza-as durante 5 minutos, e podem ficar em memória mais tempo, até entradas mais recentes as substituírem ou o servidor reiniciar. Não incluem coordenadas nem nomes de sítios.",
    "p2.p3": "O ohmigo não te pede o nome, o email nem a conta no assistente. O que o assistente se lembra de ti (o carro, os cartões) fica com o assistente e segue a política dele.",

    "p3.h": "Para onde vão os dados",
    "p3.li1": "Para calcular o preço da energia, o ohmigo envia ao <a href=\"https://ceme.ocarroeletrico.com\" target=\"_blank\" rel=\"noopener\">ceme-v2</a> (também nosso) a sessão estimada, cortada em fatias de um quarto de hora: quando começa cada fatia (a primeira na hora de início, ao minuto) e os kWh de cada uma, com o total. Envia também a região (continente, Madeira ou Açores) e, se os indicaste, os kWh do mês por tarifário, com os identificadores desses tarifários. Sem coordenadas, sem nome do sítio, sem identificação.",
    "p3.li2": "O estado dos postos vem do feed público do Ponto de Acesso Nacional (PAN) e a lista de postos do nosso conjunto de dados. Nestes pedidos não vai nada teu.",
    "p3.li3": "O serviço corre no <a href=\"https://zerops.io/\" target=\"_blank\" rel=\"noopener\">Zerops</a> (Praga, UE), com a <a href=\"https://www.cloudflare.com/privacypolicy/\" target=\"_blank\" rel=\"noopener\">Cloudflare</a> à frente para HTTPS e proteção contra abusos. Como em qualquer site, cada pedido passa por estes serviços antes de chegar ao ohmigo, com o conteúdo e o teu endereço IP (ou o do assistente), e eles tratam-nos por nossa conta. A Cloudflare é uma empresa dos EUA, aderente ao Quadro de Privacidade de Dados UE-EUA. O Zerops também recolhe os registos descritos abaixo.",
    "p3.p": "Com o ChatGPT e o Claude na web, os pedidos vêm dos servidores do assistente, não do teu dispositivo, por isso o IP que chega é o deles. Um assistente que corre no teu computador liga-se com o teu IP, e o mesmo acontece quando abres estas páginas no browser. O ohmigo não usa esse IP.",

    "p4.h": "Registos e cookies",
    "p4.p1": "O ohmigo não regista os dados das perguntas nem os IP. Por cada chamada a uma ferramenta escreve uma linha técnica: a hora, a ferramenta, quanto demorou, se deu erro, o código do erro e o tamanho da resposta. Escreve também mensagens de arranque, de atualização dos dados e erros técnicos, e soma contadores por ferramenta, públicos em <a href=\"/healthz\">/healthz</a>. Existe um modo de teste que regista os dados das perguntas; está desligado no serviço público.",
    "p4.p2": "Não usamos cookies nem analytics. A página inicial só grava no teu browser a língua que escolheste (<code>localStorage</code>, chave <code>ohmigo.lang</code>), para a lembrar. Podes apagá-la nas definições do browser.",
    "p4.p3": "A base legal é o interesse legítimo em manter o serviço seguro e a funcionar (art. 6.º, n.º 1, alínea f) do RGPD).",

    "p5.h": "Os teus direitos",
    "p5.p": "Podes pedir acesso, correção ou apagamento dos teus dados, ou opor-te ao tratamento, por <a href=\"mailto:info@ocarroeletrico.com\">email</a>. Como não guardamos nada que possamos ligar a ti, na prática não há muito a apagar, mas respondemos na mesma. Se achares que não respondemos bem, podes queixar-te à <a href=\"https://www.cnpd.pt/\" target=\"_blank\" rel=\"noopener\">CNPD</a>.",

    "p6.h": "Mudanças",
    "p6.p": "Se o ohmigo passar a guardar ou a enviar alguma coisa nova, esta página muda primeiro. O histórico completo está no <a href=\"https://github.com/CarregaErvilhas/ohmigo-mcp/commits/main/site/legal.html\" target=\"_blank\" rel=\"noopener\">GitHub</a>.",
    "p6.updated": "<small>Última atualização: 31 de outubro de 2026.</small>",

    "support.title": "Suporte · ohmigo",
    "support.desc": "Como falar com a equipa do ohmigo: problemas, sugestões e dúvidas sobre preços de carregamento.",
    "support.h1": "Fala connosco",
    "support.lede": "Dúvidas, correções, ideias: tudo é bem-vindo. E se encontraste um erro, ainda melhor.",

    "s1.h": "Encontraste um erro ou tens uma sugestão?",
    "s1.p1": "A forma mais rápida de veres uma coisa corrigida é abrir uma issue no GitHub. Se preferires, escreve por email ou pelo Messenger.",
    "s1.cta1": "GitHub Issues ↗",
    "s1.cta2": "info@ocarroeletrico.com",
    "s1.cta3": "Messenger ↗",

    "s2.h": "O que vale a pena escrever",
    "s2.li1": "<b>O que perguntaste</b> ao assistente, e qual assistente usaste (ChatGPT, Claude…).",
    "s2.li2": "<b>Quando</b> (dia e hora) e <b>onde</b> (o posto ou a localidade). Com isso conseguimos reproduzir o que viste.",
    "s2.li3": "Se o problema é um preço, diz o <b>tarifário</b> (CEME), o operador e o valor que esperavas.",
    "s2.li4": "Não envies palavras-passe, cartões nem dados pessoais. Não precisamos deles.",

    "s3.h": "Dúvidas comuns",
    "s3.li1": "<b>Não consigo adicionar o ohmigo ao ChatGPT.</b> A conta gratuita não permite conectores, e alguns planos pagos também não. Os passos estão <a href=\"/#instalar\">na página inicial</a>, e o Claude é a alternativa.",
    "s3.li2": "<b>O preço é diferente do que paguei.</b> Os valores são estimativas e cada resposta diz o que assumiu. Os preços diretos dos operadores são lidos de uma lista pública semanal e podem estar desatualizados.",
    "s3.li3": "<b>O estado do posto está errado.</b> A nossa cópia do estado ao vivo pode ter 15 minutos ou mais, e o primeiro pedido depois de uma pausa pode demorar cerca de 25 segundos.",
    "s3.li4": "<b>O serviço está a funcionar?</b> <a href=\"/healthz\">/healthz</a> mostra se está no ar e quão frescos estão os dados.",

    "s4.h": "Um aviso",
    "s4.p": "O ohmigo é uma ferramenta da comunidade, mantida no tempo livre por pessoas que também carregam o carro na mesma rede que tu. Não é um comercializador de energia nem um operador de postos, não tem anúncios e não guarda nada que possamos ligar a ti. Não prometemos um prazo de resposta, mas lemos tudo."
  },
  "en": {
    "nav.home": "Home",
    "nav.privacy": "Privacy",
    "nav.support": "Support",

    "privacy.title": "Privacy · ohmigo",
    "privacy.desc": "What ohmigo receives when your assistant uses it, what it keeps and who to ask: no accounts, no ads, no cookies.",
    "privacy.h1": "Privacy",
    "privacy.lede": "No accounts, no ads, no cookies and no user database. ohmigo answers the question and doesn't tie it to you.",

    "p1.h": "Who is responsible",
    "p1.p": "ohmigo is kept by the <a href=\"https://ocarroeletrico.com/\" target=\"_blank\" rel=\"noopener\">O Carro Elétrico</a> community. For any request about your data, write to <a href=\"mailto:info@ocarroeletrico.com\">info@ocarroeletrico.com</a>.",

    "p2.h": "What ohmigo receives",
    "p2.p1": "When your assistant (ChatGPT, Claude…) uses ohmigo, it sends the details of your question: a place, coordinates, a route or your destination, your car's battery size and charging power, the battery percentage, the start time, filters (such as power or plug type), the tariffs you use, the kWh you already charged this month on each tariff, whether you qualify for a price kept for one group (a company's staff, Uber drivers), any search words (an operator's or a street's name, say) and the language of the answer. Only what the assistant sends arrives. If it sends your location, ohmigo receives it.",
    "p2.p2": "These details are used only to work out the answer. We don't link them to you, they don't go to disk, and we have no accounts or user database. One thing stays in the server's memory after the request: to avoid repeating the same calculation, ohmigo keeps ceme-v2's answers together with what it asked (the session profile, the region and the month's kWh per tariff, see below). It reuses them for 5 minutes, and they can stay in memory longer, until newer entries replace them or the server restarts. They include no coordinates or place names.",
    "p2.p3": "ohmigo doesn't ask for your name, your email or your account with the assistant. What the assistant remembers about you (your car, your cards) stays with the assistant and follows its policy.",

    "p3.h": "Where the data goes",
    "p3.li1": "To price the energy, ohmigo sends <a href=\"https://ceme.ocarroeletrico.com\" target=\"_blank\" rel=\"noopener\">ceme-v2</a> (also ours) the estimated session, cut into quarter-hour slices: when each slice starts (the first at the start time, to the minute) and its kWh, with the total. It also sends the region (mainland, Madeira or the Azores) and, if you gave them, the month's kWh per tariff, with those tariffs' ids. No coordinates, no place name, no identity.",
    "p3.li2": "Charger status comes from the public feed of Portugal's National Access Point (NAP) and the charger list from our dataset. Nothing of yours goes with these requests.",
    "p3.li3": "The service runs on <a href=\"https://zerops.io/\" target=\"_blank\" rel=\"noopener\">Zerops</a> (Prague, EU), with <a href=\"https://www.cloudflare.com/privacypolicy/\" target=\"_blank\" rel=\"noopener\">Cloudflare</a> in front for HTTPS and abuse protection. As with any website, every request goes through these services before it reaches ohmigo, with its content and your IP address (or the assistant's), and they process them on our behalf. Cloudflare is a US company certified under the EU-US Data Privacy Framework. Zerops also collects the logs described below.",
    "p3.p": "With ChatGPT and Claude on the web, requests come from the assistant's servers, not from your device, so the IP that arrives is theirs. An assistant running on your computer connects with your IP, and so does your browser when you open these pages. ohmigo doesn't use that IP.",

    "p4.h": "Logs and cookies",
    "p4.p1": "ohmigo doesn't log the details of your questions or IP addresses. For each tool call it writes one technical line: the time, the tool, how long it took, whether it failed, the error code and the size of the answer. It also writes start-up messages, data refresh messages and technical errors, and adds up per-tool counters, public at <a href=\"/healthz\">/healthz</a>. A test mode that logs the details of questions exists; it is off on the public service.",
    "p4.p2": "We use no cookies and no analytics. The home page only saves the language you picked in your browser (<code>localStorage</code>, key <code>ohmigo.lang</code>), to remember it. You can clear it in your browser settings.",
    "p4.p3": "The legal basis is our legitimate interest in keeping the service safe and working (GDPR art. 6(1)(f)).",

    "p5.h": "Your rights",
    "p5.p": "You can ask for access, correction or erasure of your data, or object to its processing, by <a href=\"mailto:info@ocarroeletrico.com\">email</a>. Since we keep nothing we can link to you there is little to erase, but we answer anyway. If you think we did not answer properly, you can complain to the Portuguese data protection authority, <a href=\"https://www.cnpd.pt/\" target=\"_blank\" rel=\"noopener\">CNPD</a>.",

    "p6.h": "Changes",
    "p6.p": "If ohmigo starts storing or sending anything new, this page changes first. The full history is on <a href=\"https://github.com/CarregaErvilhas/ohmigo-mcp/commits/main/site/legal.html\" target=\"_blank\" rel=\"noopener\">GitHub</a>.",
    "p6.updated": "<small>Last updated: 31 October 2026.</small>",

    "support.title": "Support · ohmigo",
    "support.desc": "How to reach the ohmigo team: problems, suggestions and questions about charging prices.",
    "support.h1": "Get in touch",
    "support.lede": "Questions, corrections, ideas: all welcome. And if you found a mistake, even better.",

    "s1.h": "Spotted a mistake, or got a suggestion?",
    "s1.p1": "The quickest way to see something fixed is to open an issue on GitHub. If you'd rather, write an email or use Messenger.",
    "s1.cta1": "GitHub Issues ↗",
    "s1.cta2": "info@ocarroeletrico.com",
    "s1.cta3": "Messenger ↗",

    "s2.h": "What is worth telling us",
    "s2.li1": "<b>What you asked</b> the assistant, and which assistant you used (ChatGPT, Claude…).",
    "s2.li2": "<b>When</b> (day and time) and <b>where</b> (the charger or the town). With that we can reproduce what you saw.",
    "s2.li3": "If the problem is a price, tell us the <b>tariff</b> (CEME), the operator and the value you expected.",
    "s2.li4": "Don't send passwords, cards or personal data. We don't need them.",

    "s3.h": "Common questions",
    "s3.li1": "<b>I can't add ohmigo to ChatGPT.</b> Free accounts can't add connectors, and some paid plans can't either. The steps are <a href=\"/#instalar\">on the home page</a>, and Claude is the alternative.",
    "s3.li2": "<b>The price differs from what I paid.</b> Values are estimates, and every answer says what it assumed. Operators' direct prices are read from a public weekly list and may be out of date.",
    "s3.li3": "<b>The charger status is wrong.</b> Our copy of the live status can be 15 minutes old or more, and the first request after a quiet spell can take about 25 seconds.",
    "s3.li4": "<b>Is the service up?</b> <a href=\"/healthz\">/healthz</a> shows whether it is running and how fresh the data is.",

    "s4.h": "One note",
    "s4.p": "ohmigo is a community tool, kept in spare time by people who also charge their car on the same network as you. It is not an energy retailer or a charger operator, has no ads and keeps nothing we can link to you. We don't promise a reply time, but we read everything."
  }
}
