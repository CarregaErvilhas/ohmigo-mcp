    "s2.li4": "Don't send passwords, cards or personal data. We don't need them.",

    "s3.h": "Common questions",
    "s3.li1": "<b>I can't add ohmigo to ChatGPT.</b> Free accounts can't add connectors, and some paid plans can't either. The steps are <a href=\"/#instalar\">on the home page</a>, and Claude is the alternative.",
    "s3.li2": "<b>The price differs from what I paid.</b> Values are estimates, and every answer says what it assumed. Operators' direct prices are read from a public weekly list and may be out of date.",
    "s3.li3": "<b>The charger status is wrong.</b> Live status can be up to 5 minutes old, and the first request after a quiet spell can take about 25 seconds.",
    "s3.li4": "<b>Is the service up?</b> <a href=\"/healthz\">/healthz</a> shows whether it is running and how fresh the data is.",

    "s4.h": "One note",
    "s4.p": "ohmigo is a community tool, kept in spare time by people who also charge their car on the same network as you. It is not an energy retailer or a charger operator, has no ads and keeps no data about you. We don't promise a reply time, but we read everything."
  }
}
</script>
<script>
(() => {
  const S = JSON.parse(document.getElementById('strings').textContent);
  // Which page: the path decides (the server sends this file for all four).
  const page = /^\/(suporte|support)\/?$/.test(location.pathname) ? 'support'
    : /^\/(termos|terms)\/?$/.test(location.pathname) ? 'terms' : 'privacy';
  const PAGES = {
    privacy: [
      ['p1.h', 'p1.p'],
      ['p2.h', 'p2.p1', 'p2.p2', 'p2.p3'],
      ['p3.h', ['p3.li1', 'p3.li2', 'p3.li3'], 'p3.p'],
      ['p4.h', 'p4.p1', 'p4.p2', 'p4.p3'],
      ['p5.h', 'p5.p'],
      ['p6.h', 'p6.p', 'p6.updated'],
    ],
    terms: [
      ['t1.h', 't1.p'],
      ['t2.h', 't2.p1', 't2.p2'],
      ['t3.h', ['t3.li1', 't3.li2', 't3.li3'], 't3.p'],
      ['t4.h', 't4.p'],
      ['t5.h', 't5.p'],
      ['t6.h', 't6.p'],
      ['t7.h', 't7.p'],
      ['t8.h', 't8.p'],
      ['t9.h', 't9.p', 't9.updated'],
    ],
    support: [
      ['s1.h', 's1.p1', 'CTA'],
      ['s2.h', ['s2.li1', 's2.li2', 's2.li3', 's2.li4']],
      ['s3.h', ['s3.li1', 's3.li2', 's3.li3', 's3.li4']],
      ['s4.h', 's4.p'],
    ],
  };
  const store = {
    get() { try { return localStorage.getItem('ohmigo.lang'); } catch { return null; } },
    set(v) { try { localStorage.setItem('ohmigo.lang', v); } catch {} },
  };
  // Same order as the home page: ?lang=, the earlier pick, the browser, English.
  function detect() {
    const q = new URLSearchParams(location.search).get('lang');
    if (q === 'pt' || q === 'en') return q;
    const saved = store.get();
    if (saved === 'pt' || saved === 'en') return saved;
    for (const l of navigator.languages || [navigator.language || '']) {
      if (/^pt\b/i.test(l)) return 'pt';
      if (/^en\b/i.test(l)) return 'en';
    }
    return 'en';
  }
  const el = id => document.getElementById(id);
  function apply(lang) {
    const t = S[lang];
    document.documentElement.lang = lang === 'pt' ? 'pt-PT' : 'en';
    document.title = t[page + '.title'];
    document.querySelector('meta[name="description"]').content = t[page + '.desc'];
    el('h1').textContent = t[page + '.h1'];
    el('lede').textContent = t[page + '.lede'];
    el('body').innerHTML = PAGES[page].map(([h, ...rest]) => {
      const inner = rest.map(k => {
        if (Array.isArray(k)) return '<ul>' + k.map(x => `<li>${t[x]}</li>`).join('') + '</ul>';
        if (k === 'CTA') {
          return '<div class="cta">'
            + `<a href="https://github.com/CarregaErvilhas/ohmigo-mcp/issues" target="_blank" rel="noopener">${t['s1.cta1']}</a>`
            + `<a class="sec" href="mailto:info@ocarroeletrico.com">${t['s1.cta2']}</a>`
            + `<a class="sec" href="https://m.me/OCarroEletricoDotCom" target="_blank" rel="noopener">${t['s1.cta3']}</a></div>`;
        }
        return `<p>${t[k]}</p>`;
      }).join('');
      return `<article><h2>${t[h]}</h2>${inner}</article>`;
    }).join('');
    for (const n of document.querySelectorAll('[data-i]')) n.innerHTML = t[n.dataset.i];
    for (const b of document.querySelectorAll('[data-lang]')) b.setAttribute('aria-pressed', String(b.dataset.lang === lang));
  }
  apply(detect());
  for (const b of document.querySelectorAll('[data-lang]')) {
    b.addEventListener('click', () => { store.set(b.dataset.lang); apply(b.dataset.lang); });
  }
})();
</script>
</body>
</html>
