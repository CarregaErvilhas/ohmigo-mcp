<script>
// Runs before the first paint, here and, copied by src/site.js, on the
// privacy, support and terms pages. A theme picked with this page's header
// button wins over the system's; with none saved, the CSS follows
// prefers-color-scheme. The `js` class shows the parts only a script can run
// (the theme button, the topic buttons) and hides what the script fades in.
document.documentElement.classList.add('js');
try {
  const t = localStorage.getItem('ohmigo.theme');
  if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  const v = localStorage.getItem('ohmigo.vision');
  if (v === 'cb' || v === 'hc') document.documentElement.dataset.vision = v;
} catch {}
</script>

  @media (prefers-color-scheme: dark) {

      --green: #7dffa6; --green-soft: #00260b; --green-ink: #d6ffe4; --green-deep: #3ccf72; --on-green: #00200a;
      --band: #000; --band-fg: #fff; --band-tag: #7dffa6; --band-tag-fg: #00200a; }

  /* vision: end */

  * { box-sizing: border-box; }

  :focus-visible { outline: 3px solid var(--green-ink); outline-offset: 2px; }

  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px; }
  section { padding: 72px 0; }
  .alt { background: var(--bg-alt); }
  h1, h2, h3 { line-height: 1.15; margin: 0 0 .5em; letter-spacing: -.01em; }

  .hl { background: linear-gradient(transparent 60%, var(--yellow) 60%); padding: 0 .1em; color: inherit; }

  .li { width: 24px; height: 24px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* Header */
  header { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 85%, transparent);
    backdrop-filter: saturate(1.4) blur(10px); -webkit-backdrop-filter: saturate(1.4) blur(10px); border-bottom: 1px solid var(--line); }
  .bar { display: flex; align-items: center; justify-content: space-between; height: 64px; gap: 12px; }
  .logo { display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 24px; color: var(--fg); text-decoration: none; }
  .logo svg { width: 42px; height: 42px; }
  .links { display: flex; gap: 22px; align-items: center; font-weight: 800; font-size: 16px; }
  .links a { color: var(--fg); text-decoration: none; }

  .langs { display: flex; gap: 6px; }
  .langs a { text-decoration: none; color: inherit; display: flex; align-items: center; gap: 6px; border: 2px solid transparent; background: var(--card); border-radius: 999px;
    padding: 5px 10px 5px 6px; font: 700 14px var(--font); color: var(--fg); cursor: pointer; box-shadow: var(--shadow); }

  /* Theme button: only with a script, which is what makes it work. The icon

  .theme, .vision { display: none; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--card);
    color: var(--fg); place-items: center; cursor: pointer; padding: 0; box-shadow: var(--shadow); }
  .js .theme, .js .vision { display: grid; }

  .theme svg { width: 22px; height: 22px; }
  .theme .sun { display: none; }

  @media (prefers-color-scheme: dark) {

  /* Buttons */
  .btn { display: inline-flex; align-items: center; gap: 10px; justify-content: center; font: 800 18px var(--font); text-decoration: none;
    border-radius: 999px; padding: 14px 26px; border: 0; cursor: pointer; transition: transform .15s ease, box-shadow .15s ease; min-height: 52px; }
  .btn:active { transform: scale(.97); }
  .btn-main { background: var(--green); color: var(--on-green); box-shadow: 0 6px 0 var(--green-deep), 0 10px 24px color-mix(in srgb, var(--green) 35%, transparent); }

    border-radius: 999px; padding: 8px 16px; min-height: 44px; cursor: pointer; }

  /* Hero: ohmigo answers, the topic you pick */
  .hero { padding: 40px 0 64px; position: relative; overflow: hidden; }
  .hero-head { text-align: center; }
  .hero-head h1 { max-width: 15em; margin-left: auto; margin-right: auto; }
  .hero-head .lead { margin: 0 auto; max-width: 34em; }
  .hero-grid { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 28px; align-items: center; max-width: 1000px; margin: 16px auto 0; }
  .hero .ctas { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; margin-top: 32px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; justify-content: center; }
  .chip { font-size: 15px; font-weight: 700; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; }

  .mascot { position: relative; width: min(320px, 78vw); animation: bob 3.2s ease-in-out infinite; filter: drop-shadow(0 18px 18px rgba(15,23,42,.15)); }

  .arm-wave { transform-origin: 196px 150px; animation: wave 1.6s ease-in-out infinite; }

  @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-12px) } }
  @keyframes wave { 0%,100% { transform: rotate(0) } 50% { transform: rotate(-22deg) } }
  @keyframes blink { 0%,92%,100% { transform: scaleY(1) } 95% { transform: scaleY(.1) } }
  @keyframes float { 0%,100% { transform: translateY(0) rotate(-8deg) } 50% { transform: translateY(-14px) rotate(8deg) } }

  /* The topic buttons need the script; without it the card shows the first topic. */
  .ask-label { display: none; font-size: 15px; font-weight: 800; color: var(--muted); margin: 0 0 10px; }
  .pills { display: none; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .js .ask-label { display: block; }
  .js .pills { display: flex; }
  .pill { font: 800 16px var(--font); border: 2px solid var(--line); background: var(--card); color: var(--fg);
    border-radius: 999px; padding: 8px 18px; min-height: 44px; cursor: pointer; }
  .pill[aria-pressed="true"] { border-color: var(--green); background: var(--green-soft); color: var(--green-ink); }
  .ask-card { background: var(--card); border: 1px solid var(--line); border-radius: 26px; box-shadow: var(--shadow); padding: 18px; }
  .ask-card .q { margin: 0 0 14px auto; width: fit-content; max-width: 85%; background: var(--green); color: var(--on-green); padding: 12px 16px;
    border-radius: 20px 20px 4px 20px; font-weight: 700; line-height: 1.4; }
  .ans { display: flex; gap: 10px; align-items: flex-end; }

  .bubble { flex: 1; min-width: 0; background: var(--bg-alt); border-radius: 20px 20px 20px 4px; padding: 14px 16px; }

  /* Road divider with a car */
  .road { position: relative; height: 70px; overflow: hidden; }

    background: repeating-linear-gradient(90deg, var(--line) 0 28px, transparent 28px 48px); }
  .car { position: absolute; bottom: 16px; width: 110px; animation: drive 14s linear infinite; }
  @keyframes drive { from { left: -130px } to { left: 100% } }

  .tab { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; border: 2px solid var(--line); background: var(--card); color: var(--fg);
    border-radius: 999px; padding: 10px 18px; font: 800 16px var(--font); cursor: pointer; min-height: 48px; }
  .tab[aria-selected="true"] { border-color: var(--green); background: var(--green-soft); color: var(--green-ink); }
  .tab .dot { width: 12px; height: 12px; border-radius: 50%; }
  .panel { background: var(--card); border-radius: var(--radius); padding: 26px; box-shadow: var(--shadow); border: 1px solid var(--line); }
  .panel[hidden] { display: none; }
  .panel .note { font-size: 15px; color: var(--muted); background: var(--bg-alt); border-radius: 14px; padding: 12px 16px; margin: 0 0 18px; }
  ol.steps { list-style: none; counter-reset: s; padding: 0; margin: 0; }
  ol.steps > li { counter-increment: s; position: relative; padding: 4px 0 18px 58px; min-height: 46px; }
  ol.steps > li::before { content: counter(s); position: absolute; left: 0; top: 0; width: 42px; height: 42px; border-radius: 50%;
    background: var(--yellow); color: #422006; font-weight: 900; display: grid; place-items: center; font-size: 20px; }
  ol.steps > li:not(:last-child)::after { content: ""; position: absolute; left: 20px; top: 46px; bottom: 4px; width: 2px; background: var(--line); }
  .k { display: inline-block; font-weight: 800; background: var(--bg-alt); border: 1px solid var(--line); border-bottom-width: 3px; border-radius: 8px;
    padding: 0 8px; font-size: .92em; white-space: nowrap; }
  .done { display: flex; gap: 12px; align-items: center; background: var(--green-soft); color: var(--green-ink); border-radius: 14px; padding: 12px 16px; font-weight: 700; margin-top: 4px; }
  .done span { font-size: 28px; }
  pre { background: var(--bg-alt); border-radius: 12px; padding: 12px 14px; overflow-x: auto; font: 14px/1.5 var(--mono); margin: 8px 0 0; }
  .encourage { display: flex; gap: 14px; align-items: center; margin-top: 22px; }
  .encourage svg { width: 96px; flex: 0 0 auto; }
  .encourage p { margin: 0; background: var(--card); border-radius: 18px 18px 18px 4px; padding: 12px 16px; box-shadow: var(--shadow); font-weight: 700; }

  /* FAQ */
  .faq { max-width: 760px; margin-top: 26px; }
  details { background: var(--card); border: 1px solid var(--line); border-radius: 16px; margin-bottom: 10px; box-shadow: var(--shadow); }
  summary { list-style: none; cursor: pointer; padding: 16px 52px 16px 20px; font-weight: 800; position: relative; }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: "+"; position: absolute; right: 18px; top: 50%; transform: translateY(-50%); font-size: 26px; color: var(--green); font-weight: 900; transition: transform .2s; }
  details[open] summary::after { transform: translateY(-50%) rotate(45deg); }
  details > div { padding: 0 20px 16px; color: var(--muted); font-size: 17px; }
  details > div p:last-child { margin: 0; }

  /* Final CTA + footer */
  .final { text-align: center; }
  .final .mascot { width: 190px; }
  footer { padding: 36px 0 48px; font-size: 15px; color: var(--muted); border-top: 1px solid var(--line); }
  footer p { margin: 0 0 .6em; }

  /* Toast + confetti */
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 120px); background: var(--fg); color: var(--bg); font-weight: 800;
    padding: 12px 20px; border-radius: 999px; transition: transform .3s ease; z-index: 50; box-shadow: var(--shadow); max-width: calc(100vw - 32px); text-align: center; }
  .toast.on { transform: translate(-50%, 0); }
  .confetti { position: fixed; top: 0; left: 0; width: 10px; height: 14px; pointer-events: none; z-index: 60; border-radius: 2px; }

  /* Only hidden once the script runs: without it the page stays readable. */
  .js .reveal { opacity: 0; transform: translateY(20px); transition: opacity .6s ease, transform .6s ease; }
  .js .reveal.in { opacity: 1; transform: none; }

  @media (max-width: 900px) {
    .links { display: none; }
    .tips { grid-template-columns: 1fr; padding-right: 0; }
    .band-mascot, .band-bulb { display: none; }
  }
  @media (max-width: 760px) {
    body { font-size: 17px; }
    section { padding: 52px 0; }
    .hero { padding-top: 24px; }
    .hero-grid, .demo-grid, .split, .toc { grid-template-columns: 1fr; }
    /* On a phone ohmigo comes first, above the headline, as people know it.
       The grid steps aside so its stage can move ahead of .hero-head. */
    .hero .wrap { display: flex; flex-direction: column; }
    .hero-grid { display: contents; }
    .hero-head { margin-bottom: 20px; }
    .split { gap: 24px; }
    .mascot-stage { order: -1; min-height: 230px; }
    .hero .mascot { width: min(180px, 52vw); }
    .mascot-stage::before { width: min(88%, 240px); }
    .btn { width: 100%; }
    .urlbox .btn { width: auto; flex: 1 1 auto; }
    .panel { padding: 20px 16px; }
    .tabs { display: grid; grid-template-columns: 1fr 1fr; overflow: visible; }
    .tab { justify-content: center; }
    .langs .lbl { display: none; }
    .langs a { padding: 5px; }
    .bubble-hi { right: 4%; }
    .ask-card { padding: 14px; }
    .avatar { width: 48px; height: 48px; }
    .avatar svg { width: 36px; height: 47px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .js .reveal, .msg { opacity: 1; transform: none; }
    html { scroll-behavior: auto; }
  }
</style>
</head>

<script>
(() => {
  const S = JSON.parse(document.getElementById('strings').textContent);
  // The server renders each language at its own URL (/ and /en, see
  // src/site.js), so search engines index both. A visitor who picked English
  // before is sent there from /; nobody else is redirected (a crawler must
  // see the page it asked for). The privacy, support and terms pages run no
  // script but the theme one, so their home links carry the language being read (?lang=) and it is
  // saved here: a choice made on those pages isn't undone by an older one.
  const store = {
    get() { try { return localStorage.getItem('ohmigo.lang'); } catch { return null; } },
    set(v) { try { localStorage.setItem('ohmigo.lang', v); } catch {} },
  };
  const lang = document.documentElement.lang === 'en' ? 'en' : 'pt';
  const asked = new URLSearchParams(location.search).get('lang');
  if (asked === lang) store.set(lang);
  if (lang === 'pt' && store.get() === 'en' && asked === null) {
    location.replace('/en' + location.search + location.hash);
  }
  for (const a of document.querySelectorAll('[data-lang]')) {
    a.addEventListener('click', e => { store.set(a.dataset.lang); a.href = a.getAttribute('href') + location.hash; });
  }

  // Theme button. The script in <head> applied a saved choice before the
  // first paint; without one the page follows the system, and the button
  // says which of the two the page shows now. A click saves the other one.
  const root = document.documentElement;
  const systemDark = matchMedia('(prefers-color-scheme: dark)');
  const isDark = () => (root.dataset.theme || (systemDark.matches ? 'dark' : 'light')) === 'dark';
  const themeButton = document.getElementById('theme');
  const showTheme = () => themeButton.setAttribute('aria-pressed', String(isDark()));
  themeButton.addEventListener('click', () => {
    const t = isDark() ? 'light' : 'dark';
    root.dataset.theme = t;
    try { localStorage.setItem('ohmigo.theme', t); } catch {}
    showTheme();
  });
  systemDark.addEventListener('change', showTheme);
  showTheme();

  // Vision button: normal -> colour-blind safe -> high contrast -> normal. It
  // sits beside the theme button and combines with it (light/dark). Saved like
  // the theme, under its own key; "off" removes the key.
  const MODES = ['off', 'cb', 'hc'];
  const visionButton = document.getElementById('vision');
  const mode = () => (MODES.includes(root.dataset.vision) ? root.dataset.vision : 'off');
  function showVision() {
    const label = S[lang]['vision.' + mode()];
    visionButton.setAttribute('aria-label', label);
    visionButton.title = label;
    visionButton.setAttribute('aria-pressed', String(mode() !== 'off'));
  }
  visionButton.addEventListener('click', () => {
    const next = MODES[(MODES.indexOf(mode()) + 1) % MODES.length];
    if (next === 'off') delete root.dataset.vision; else root.dataset.vision = next;
    try { next === 'off' ? localStorage.removeItem('ohmigo.vision') : localStorage.setItem('ohmigo.vision', next); } catch {}
    showVision();
    say('vision.toast.' + next);
  });
  showVision();

  // Copy buttons: the URL box and the hero's question.
  const toast = document.getElementById('toast');
  let toastTimer;
  function say(key) {
    toast.textContent = S[lang][key];
    toast.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('on'), 2600);
  }
  async function copy(text) {
    try { await navigator.clipboard.writeText(text); return true; }
    catch {
      // Older browsers and non-HTTPS previews have no clipboard API.
      const ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      let ok = false; try { ok = document.execCommand('copy'); } catch {}
      ta.remove(); return ok;
    }
  }
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function confetti(x, y) {
    if (reduced) return;
    const colors = ['#22c55e', '#facc15', '#fb7185', '#38bdf8', '#a78bfa'];
    for (let i = 0; i < 40; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.background = colors[i % colors.length];
      document.body.appendChild(c);
      const a = Math.random() * Math.PI * 2, v = 120 + Math.random() * 220;
      c.animate([
        { transform: `translate(${x}px, ${y}px) rotate(0)`, opacity: 1 },
        { transform: `translate(${x + Math.cos(a) * v}px, ${y + Math.sin(a) * v + 260}px) rotate(${Math.random() * 720}deg)`, opacity: 0 },
      ], { duration: 1100 + Math.random() * 600, easing: 'cubic-bezier(.2,.7,.4,1)' }).onfinish = () => c.remove();
    }
  }
  for (const b of document.querySelectorAll('[data-copy]')) {
    b.addEventListener('click', async e => {
      const ok = await copy(document.querySelector(b.dataset.copy).textContent.trim());
      say(ok ? 'toast.url' : 'toast.fail');
      if (ok) confetti(e.clientX || innerWidth / 2, e.clientY || innerHeight / 2);
    });
  }

  // Hero topics: each button puts its question, what ohmigo gives the
  // assistant and the source in the card. The server rendered the first one.
  const ask = { q: document.getElementById('ask-q'), a: document.getElementById('ask-a'), src: document.getElementById('ask-src') };
  const pills = [...document.querySelectorAll('[data-topic]')];
  for (const p of pills) {
    p.addEventListener('click', () => {
      for (const o of pills) o.setAttribute('aria-pressed', String(o === p));
      for (const [part, el] of Object.entries(ask)) el.innerHTML = S[lang][`topic.${p.dataset.topic}.${part}`];
    });
  }
  document.getElementById('ask-copy').addEventListener('click', async () => {
    const ok = await copy(ask.q.textContent.trim());
    say(ok ? 'toast.prompt' : 'toast.fail');
  });

  // Install tabs, with arrow-key support.
  const tabs = [...document.querySelectorAll('[role="tab"]')];
  function select(tab) {
    for (const t of tabs) {
      const on = t === tab;
      t.setAttribute('aria-selected', String(on));
      t.tabIndex = on ? 0 : -1;
      document.getElementById(t.getAttribute('aria-controls')).hidden = !on;
    }
  }
  tabs.forEach((t, i) => {
    t.addEventListener('click', () => select(t));
    t.addEventListener('keydown', e => {
      const d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
      if (d) { const n = tabs[(i + d + tabs.length) % tabs.length]; select(n); n.focus(); }
    });
  });
  // Phones get the phone tab first: that's the question they'll have.
  if (/Android|iPhone|iPad/i.test(navigator.userAgent)) select(document.getElementById('t-phone'));

  // Fade sections in, and play the chat when it scrolls into view.
  const msgs = [...document.querySelectorAll('#chat .msg')];
  const show = () => msgs.forEach((m, i) => setTimeout(() => m.classList.add('on'), reduced ? 0 : 400 + i * 900));
  if ('IntersectionObserver' in window) {
    const io = new IntersectionObserver(entries => {
      for (const e of entries) {
        if (!e.isIntersecting) continue;
        if (e.target.id === 'chat') show(); else e.target.classList.add('in');
        io.unobserve(e.target);
      }
    }, { threshold: .2 });
    document.querySelectorAll('.reveal, #chat').forEach(el => io.observe(el));
  } else {
    document.querySelectorAll('.reveal').forEach(el => el.classList.add('in'));
    show();
  }
})();
</script>
</body>
</html>
