<style>
  :root {

    --pink: #fb7185;
    --blue: #38bdf8;
    --body: #22c55e;
    --shadow: 0 1px 2px rgba(15, 23, 42, .06), 0 8px 24px rgba(15, 23, 42, .06);
    --radius: 20px;

  :root[data-theme="dark"] {
    --bg: #0d1412; --bg-alt: #111c18; --card: #16221e; --fg: #ecf3ef; --muted: #9fb0a8;
    --line: #24332d; --green: #4ade80; --green-soft: #173726; --green-ink: #bbf7d0;
    --yellow-soft: #3a3410; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 18px/1.6 var(--font); overflow-x: hidden; }
  a { color: var(--green); }
  b, strong { font-weight: 800; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px; }
  section { padding: 72px 0; }
  .alt { background: var(--bg-alt); }
  h1, h2, h3 { line-height: 1.15; margin: 0 0 .5em; letter-spacing: -.01em; }
  h1 { font-size: clamp(36px, 7vw, 64px); font-weight: 900; }
  h2 { font-size: clamp(28px, 4.6vw, 42px); font-weight: 900; }
  h3 { font-size: 21px; font-weight: 800; }
  p { margin: 0 0 1em; }
  .lead { font-size: clamp(19px, 2.4vw, 22px); color: var(--muted); max-width: 40em; }
  .eyebrow { display: inline-block; font-size: 14px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase;
    color: var(--green-ink); background: var(--green-soft); padding: 4px 12px; border-radius: 999px; margin-bottom: 14px; }
  .hl { background: linear-gradient(transparent 60%, var(--yellow) 60%); padding: 0 .1em; color: inherit; }
  :root[data-theme="dark"] .hl { background: linear-gradient(transparent 62%, rgba(250,204,21,.45) 62%); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .hl { background: linear-gradient(transparent 62%, rgba(250,204,21,.45) 62%); } }

  /* Header */
  header { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 85%, transparent);
    backdrop-filter: saturate(1.4) blur(10px); -webkit-backdrop-filter: saturate(1.4) blur(10px); border-bottom: 1px solid var(--line); }
  .bar { display: flex; align-items: center; justify-content: space-between; height: 60px; gap: 12px; }
  .logo { display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 22px; color: var(--fg); text-decoration: none; }
  .logo svg { width: 34px; height: 34px; }
  .langs { display: flex; gap: 6px; }
  .langs a { text-decoration: none; color: inherit; display: flex; align-items: center; gap: 6px; border: 2px solid transparent; background: var(--card); border-radius: 999px;
    padding: 5px 10px 5px 6px; font: 700 14px var(--font); color: var(--fg); cursor: pointer; box-shadow: var(--shadow); }
  .langs a[aria-current="page"] { border-color: var(--green); }
  .langs svg { width: 24px; height: 24px; border-radius: 50%; display: block; }

  /* Buttons */
  .btn { display: inline-flex; align-items: center; gap: 10px; justify-content: center; font: 800 18px var(--font); text-decoration: none;
    border-radius: 999px; padding: 14px 26px; border: 0; cursor: pointer; transition: transform .15s ease, box-shadow .15s ease; min-height: 52px; }
  .btn:active { transform: scale(.97); }
  .btn-main { background: var(--green); color: #fff; box-shadow: 0 6px 0 #0f7a36, 0 10px 24px rgba(22,163,74,.35); }
  :root[data-theme="dark"] .btn-main { color: #052e16; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn-main { color: #052e16; } }
  .btn-main:hover { transform: translateY(-2px); }
  .btn-ghost { background: var(--card); color: var(--fg); box-shadow: var(--shadow); }

  /* Hero */
  .hero { padding: 48px 0 72px; position: relative; overflow: hidden; }
  .hero-grid { display: grid; grid-template-columns: 1.15fr .85fr; gap: 32px; align-items: center; }
  .hero .ctas { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 26px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 22px; }
  .chip { font-size: 15px; font-weight: 700; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; }
  .mascot-stage { position: relative; display: grid; place-items: center; min-height: 340px; }
  .mascot-stage::before { content: ""; position: absolute; width: 88%; aspect-ratio: 1; border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, var(--yellow-soft), var(--green-soft) 70%); }
  .mascot { position: relative; width: min(320px, 78vw); animation: bob 3.2s ease-in-out infinite; filter: drop-shadow(0 18px 18px rgba(15,23,42,.15)); }
  .arm-wave { transform-origin: 196px 150px; animation: wave 1.6s ease-in-out infinite; }
  .blink { transform-origin: center 118px; animation: blink 4.5s infinite; }
  .bolt { position: absolute; width: 38px; animation: float 4s ease-in-out infinite; }
  .bolt.b1 { top: 6%; left: 8%; }
  .bolt.b2 { top: 18%; right: 4%; width: 28px; animation-delay: -1.3s; }
  .bolt.b3 { bottom: 10%; left: 2%; width: 24px; animation-delay: -2.4s; }
  .bubble-hi { position: absolute; top: 4%; right: 10%; background: var(--card); border-radius: 18px 18px 18px 4px; padding: 8px 14px;
    font-weight: 900; box-shadow: var(--shadow); animation: pop 3.2s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-12px) } }
  @keyframes wave { 0%,100% { transform: rotate(0) } 50% { transform: rotate(-22deg) } }
  @keyframes blink { 0%,92%,100% { transform: scaleY(1) } 95% { transform: scaleY(.1) } }
  @keyframes float { 0%,100% { transform: translateY(0) rotate(-8deg) } 50% { transform: translateY(-14px) rotate(8deg) } }
  @keyframes pop { 0%,100% { transform: scale(1) } 50% { transform: scale(1.06) } }

  /* Road divider with a car */
  .road { position: relative; height: 70px; overflow: hidden; }
  .road::after { content: ""; position: absolute; left: 0; right: 0; bottom: 14px; height: 4px;
    background: repeating-linear-gradient(90deg, var(--line) 0 28px, transparent 28px 48px); }
  .car { position: absolute; bottom: 16px; width: 110px; animation: drive 14s linear infinite; }
  @keyframes drive { from { left: -130px } to { left: 100% } }

  /* Chat demo */
  .demo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: center; }
  .phone { background: var(--card); border-radius: 34px; padding: 18px 16px 22px; box-shadow: var(--shadow); border: 1px solid var(--line);
    max-width: 420px; width: 100%; margin: 0 auto; }
  .phone-top { display: flex; align-items: center; gap: 8px; padding: 0 4px 12px; border-bottom: 1px solid var(--line); margin-bottom: 14px;
    font-weight: 800; font-size: 15px; color: var(--muted); }
  .phone-top i { width: 10px; height: 10px; border-radius: 50%; background: var(--green); display: inline-block; }
  .msg { max-width: 88%; padding: 10px 14px; border-radius: 18px; margin-bottom: 10px; font-size: 16px; line-height: 1.45;
    opacity: 0; transform: translateY(8px); transition: opacity .4s ease, transform .4s ease; }
  .msg.on { opacity: 1; transform: none; }
  .msg.me { margin-left: auto; background: var(--green); color: #fff; border-bottom-right-radius: 4px; }
  :root[data-theme="dark"] .msg.me { color: #052e16; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .msg.me { color: #052e16; } }
  .msg.ai { background: var(--bg-alt); border-bottom-left-radius: 4px; }
  .tool { font-size: 13px; font-weight: 800; color: var(--green-ink); background: var(--green-soft); border-radius: 999px; padding: 4px 10px;
    display: inline-flex; align-items: center; gap: 6px; }
  .tool svg { width: 16px; height: 16px; }
  .res { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 4px 12px; margin: 8px 0 4px; }
  .res div { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px dashed var(--line); font-size: 15px; }
  .res div:last-child { border-bottom: 0; }
  .res b { font-variant-numeric: tabular-nums; }
  .res .win b { color: var(--green); }
  .free { font-size: 12px; font-weight: 800; color: var(--green); }
  .fineprint { font-size: 13px; color: var(--muted); text-align: center; margin-top: 10px; }
  .typing { display: inline-flex; gap: 4px; }
  .typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: dot 1s infinite; }
  .typing span:nth-child(2) { animation-delay: .15s } .typing span:nth-child(3) { animation-delay: .3s }
  @keyframes dot { 0%,100% { opacity: .3 } 50% { opacity: 1 } }

  /* What is an MCP */
  .flow { display: grid; grid-template-columns: 1fr auto 1fr auto 1fr auto 1fr; gap: 10px; align-items: center; margin: 32px 0 8px; }
  .node { background: var(--card); border-radius: var(--radius); padding: 18px 12px; text-align: center; box-shadow: var(--shadow); font-weight: 800; font-size: 16px; }
  .node svg { width: 64px; height: 64px; display: block; margin: 0 auto 8px; }
  .node small { display: block; font-weight: 600; color: var(--muted); font-size: 14px; margin-top: 4px; line-height: 1.35; }
  .node.star { outline: 3px solid var(--green); }
  .arrow { color: var(--green); font-size: 28px; font-weight: 900; text-align: center; }
  .analogy { display: flex; gap: 16px; align-items: flex-start; background: var(--yellow-soft); border-radius: var(--radius); padding: 20px 22px; margin-top: 28px; }
  .analogy .big { font-size: 40px; line-height: 1; }
  .analogy p { margin: 0; }

  /* Cards */
  .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; margin-top: 30px; }
  .card { background: var(--card); border-radius: var(--radius); padding: 22px; box-shadow: var(--shadow); border: 1px solid var(--line);
    transition: transform .2s ease; }
  .card:hover { transform: translateY(-4px) rotate(-.4deg); }
  .card .ico { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; margin-bottom: 14px; font-size: 30px; }
  .card p { color: var(--muted); font-size: 16px; margin: 0; }

  /* Install */
  .time { display: inline-flex; gap: 8px; align-items: center; font-weight: 800; background: var(--card); border-radius: 999px; padding: 6px 14px; box-shadow: var(--shadow); }
  .urlbox { display: flex; align-items: center; gap: 10px; background: var(--card); border: 3px dashed var(--green); border-radius: 18px; padding: 10px 10px 10px 18px;
    margin: 26px 0 8px; flex-wrap: wrap; }
  .urlbox code { font: 700 clamp(15px, 2.6vw, 20px) var(--mono); flex: 1 1 260px; overflow-wrap: anywhere; color: var(--fg); }
  .urlbox .btn { padding: 10px 20px; min-height: 46px; font-size: 16px; box-shadow: 0 4px 0 #0f7a36; }
  .urlhint { font-size: 15px; color: var(--muted); }
  .tabs { display: flex; gap: 8px; margin: 30px 0 0; overflow-x: auto; padding: 4px 2px 10px; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; border: 2px solid var(--line); background: var(--card); color: var(--fg);
    border-radius: 999px; padding: 10px 18px; font: 800 16px var(--font); cursor: pointer; min-height: 48px; }
  .tab[aria-selected="true"] { border-color: var(--green); background: var(--green-soft); color: var(--green-ink); }
  .tab .dot { width: 12px; height: 12px; border-radius: 50%; }
  .panel { background: var(--card); border-radius: var(--radius); padding: 26px; box-shadow: var(--shadow); border: 1px solid var(--line); }
  .panel[hidden] { display: none; }
  .panel .note { font-size: 15px; color: var(--muted); background: var(--bg-alt); border-radius: 14px; padding: 12px 16px; margin: 0 0 18px; }
  ol.steps { list-style: none; counter-reset: s; padding: 0; margin: 0; }
  ol.steps > li { counter-increment: s; position: relative; padding: 4px 0 18px 58px; min-height: 46px; }
  ol.steps > li::before { content: counter(s); position: absolute; left: 0; top: 0; width: 42px; height: 42px; border-radius: 50%;
    background: var(--yellow); color: #422006; font-weight: 900; display: grid; place-items: center; font-size: 20px; }
  ol.steps > li:not(:last-child)::after { content: ""; position: absolute; left: 20px; top: 46px; bottom: 4px; width: 2px; background: var(--line); }
  .k { display: inline-block; font-weight: 800; background: var(--bg-alt); border: 1px solid var(--line); border-bottom-width: 3px; border-radius: 8px;
    padding: 0 8px; font-size: .92em; white-space: nowrap; }
  .done { display: flex; gap: 12px; align-items: center; background: var(--green-soft); color: var(--green-ink); border-radius: 14px; padding: 12px 16px; font-weight: 700; margin-top: 4px; }
  .done span { font-size: 28px; }
  pre { background: var(--bg-alt); border-radius: 12px; padding: 12px 14px; overflow-x: auto; font: 14px/1.5 var(--mono); margin: 8px 0 0; }
  .encourage { display: flex; gap: 14px; align-items: center; margin-top: 22px; }
  .encourage svg { width: 70px; flex: 0 0 auto; }
  .encourage p { margin: 0; background: var(--card); border-radius: 18px 18px 18px 4px; padding: 12px 16px; box-shadow: var(--shadow); font-weight: 700; }

  /* Prompts */
  .prompts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-top: 26px; }
  .prompt { display: flex; gap: 12px; align-items: flex-start; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 18px;
    padding: 16px 18px; font: 600 17px/1.45 var(--font); color: var(--fg); cursor: pointer; box-shadow: var(--shadow); transition: transform .15s ease; }
  .prompt:hover { transform: translateY(-2px); }
  .prompt .e { font-size: 26px; line-height: 1; }
  .prompt .c { margin-left: auto; font-size: 13px; font-weight: 800; color: var(--green); white-space: nowrap; padding-left: 8px; }
  .tip { margin-top: 22px; background: var(--green-soft); color: var(--green-ink); border-radius: var(--radius); padding: 16px 20px; font-weight: 600; }

  /* FAQ */
  .faq { max-width: 760px; margin-top: 26px; }
  details { background: var(--card); border: 1px solid var(--line); border-radius: 16px; margin-bottom: 10px; box-shadow: var(--shadow); }
  summary { list-style: none; cursor: pointer; padding: 16px 52px 16px 20px; font-weight: 800; position: relative; }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: "+"; position: absolute; right: 18px; top: 50%; transform: translateY(-50%); font-size: 26px; color: var(--green); font-weight: 900; transition: transform .2s; }
  details[open] summary::after { transform: translateY(-50%) rotate(45deg); }
  details > div { padding: 0 20px 16px; color: var(--muted); font-size: 17px; }
  details > div p:last-child { margin: 0; }

  /* Final CTA + footer */
  .final { text-align: center; }
  .final .mascot { width: 160px; }
  footer { padding: 36px 0 48px; font-size: 15px; color: var(--muted); border-top: 1px solid var(--line); }
  footer p { margin: 0 0 .6em; }

  /* Toast + confetti */
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 120px); background: var(--fg); color: var(--bg); font-weight: 800;
    padding: 12px 20px; border-radius: 999px; transition: transform .3s ease; z-index: 50; box-shadow: var(--shadow); max-width: calc(100vw - 32px); text-align: center; }
  .toast.on { transform: translate(-50%, 0); }
  .confetti { position: fixed; top: 0; left: 0; width: 10px; height: 14px; pointer-events: none; z-index: 60; border-radius: 2px; }

  .reveal { opacity: 0; transform: translateY(20px); transition: opacity .6s ease, transform .6s ease; }
  .reveal.in { opacity: 1; transform: none; }

  @media (max-width: 900px) {
    .cards { grid-template-columns: repeat(2, 1fr); }
    .flow { grid-template-columns: 1fr 1fr; }
    .flow .arrow { display: none; }
  }
  @media (max-width: 760px) {
    body { font-size: 17px; }
    section { padding: 52px 0; }
    .hero { padding-top: 24px; }
    .hero-grid, .demo-grid { grid-template-columns: 1fr; }
    .hero-grid .mascot-stage { order: -1; min-height: 250px; }
    .mascot { width: min(220px, 60vw); }
    .prompts { grid-template-columns: 1fr; }
    .btn { width: 100%; }
    .urlbox .btn { width: auto; flex: 1 1 auto; }
    .panel { padding: 20px 16px; }
    .tabs { display: grid; grid-template-columns: 1fr 1fr; overflow: visible; }
    .tab { justify-content: center; }
    .langs .lbl { display: none; }
    .langs a { padding: 5px; }
    .bubble-hi { right: 4%; }
  }
  @media (max-width: 420px) {
    .cards { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .reveal, .msg { opacity: 1; transform: none; }
    html { scroll-behavior: auto; }
  }
</style>
</head>

<script>
(() => {
  const S = JSON.parse(document.getElementById('strings').textContent);
  // The server renders each language at its own URL (/ and /en, see
  // src/site.js), so search engines index both. A visitor who picked English
  // before is sent there from /; nobody else is redirected (a crawler must
  // see the page it asked for).
  const store = {
    get() { try { return localStorage.getItem('ohmigo.lang'); } catch { return null; } },
    set(v) { try { localStorage.setItem('ohmigo.lang', v); } catch {} },
  };
  const lang = document.documentElement.lang === 'en' ? 'en' : 'pt';
  if (lang === 'pt' && store.get() === 'en' && !new URLSearchParams(location.search).has('lang')) {
    location.replace('/en' + location.search + location.hash);
  }
  for (const a of document.querySelectorAll('[data-lang]')) {
    a.addEventListener('click', e => { store.set(a.dataset.lang); a.href = a.getAttribute('href') + location.hash; });
  }

  // Copy buttons: the URL box and the example questions.
  const toast = document.getElementById('toast');
  let toastTimer;
  function say(key) {
    toast.textContent = S[lang][key];
    toast.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('on'), 2600);
  }
  async function copy(text) {
    try { await navigator.clipboard.writeText(text); return true; }
    catch {
      // Older browsers and non-HTTPS previews have no clipboard API.
      const ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      let ok = false; try { ok = document.execCommand('copy'); } catch {}
      ta.remove(); return ok;
    }
  }
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function confetti(x, y) {
    if (reduced) return;
    const colors = ['#22c55e', '#facc15', '#fb7185', '#38bdf8', '#a78bfa'];
    for (let i = 0; i < 40; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.background = colors[i % colors.length];
      document.body.appendChild(c);
      const a = Math.random() * Math.PI * 2, v = 120 + Math.random() * 220;
      c.animate([
        { transform: `translate(${x}px, ${y}px) rotate(0)`, opacity: 1 },
        { transform: `translate(${x + Math.cos(a) * v}px, ${y + Math.sin(a) * v + 260}px) rotate(${Math.random() * 720}deg)`, opacity: 0 },
      ], { duration: 1100 + Math.random() * 600, easing: 'cubic-bezier(.2,.7,.4,1)' }).onfinish = () => c.remove();
    }
  }
  for (const b of document.querySelectorAll('[data-copy]')) {
    b.addEventListener('click', async e => {
      const ok = await copy(document.querySelector(b.dataset.copy).textContent.trim());
      say(ok ? 'toast.url' : 'toast.fail');
      if (ok) confetti(e.clientX || innerWidth / 2, e.clientY || innerHeight / 2);
    });
  }
  for (const b of document.querySelectorAll('.prompt')) {
    b.addEventListener('click', async () => {
      const ok = await copy(b.querySelector('[data-i^="ask.p"]').textContent.trim());
      say(ok ? 'toast.prompt' : 'toast.fail');
    });
  }

  // Install tabs, with arrow-key support.
  const tabs = [...document.querySelectorAll('[role="tab"]')];
  function select(tab) {
    for (const t of tabs) {
      const on = t === tab;
      t.setAttribute('aria-selected', String(on));
      t.tabIndex = on ? 0 : -1;
      document.getElementById(t.getAttribute('aria-controls')).hidden = !on;
    }
  }
  tabs.forEach((t, i) => {
    t.addEventListener('click', () => select(t));
    t.addEventListener('keydown', e => {
      const d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
      if (d) { const n = tabs[(i + d + tabs.length) % tabs.length]; select(n); n.focus(); }
    });
  });
  // Phones get the phone tab first: that's the question they'll have.
  if (/Android|iPhone|iPad/i.test(navigator.userAgent)) select(document.getElementById('t-phone'));

  // Fade sections in, and play the chat when it scrolls into view.
  const msgs = [...document.querySelectorAll('#chat .msg')];
  const show = () => msgs.forEach((m, i) => setTimeout(() => m.classList.add('on'), reduced ? 0 : 400 + i * 900));
  if ('IntersectionObserver' in window) {
    const io = new IntersectionObserver(entries => {
      for (const e of entries) {
        if (!e.isIntersecting) continue;
        if (e.target.id === 'chat') show(); else e.target.classList.add('in');
        io.unobserve(e.target);
      }
    }, { threshold: .2 });
    document.querySelectorAll('.reveal, #chat').forEach(el => io.observe(el));
  } else {
    document.querySelectorAll('.reveal').forEach(el => el.classList.add('in'));
    show();
  }
})();
</script>
