<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ohmigo</title>
<meta name="description" content="">
<!-- seo: canonical, hreflang, Open Graph and JSON-LD, filled in by src/site.js -->
<meta name="theme-color" content="#16a34a">
<!-- theme: the landing page's theme script (THEME_SCRIPT), put here by src/site.js -->
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  /* The landing page's colours and shapes (site/index.html), cut down to what this page uses. */
  :root {
    --bg: #fbfaf5; --bg-alt: #f1f7ef; --card: #ffffff; --fg: #0f172a; --muted: #556070; --line: #e4e7e1;
    --green: #15803d; --green-deep: #0c5f2a; --on-green: #fff; --green-soft: #dcfce7; --green-ink: #14532d;
    --yellow: #facc15; --yellow-soft: #fef9c3;
    --shadow: 0 1px 2px rgba(15, 23, 42, .06), 0 8px 24px rgba(15, 23, 42, .06);
    --radius: 20px;
    --font: ui-rounded, "SF Pro Rounded", "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d1412; --bg-alt: #111c18; --card: #16221e; --fg: #ecf3ef; --muted: #9fb0a8;
      --line: #24332d; --green: #4ade80; --green-soft: #173726; --green-ink: #bbf7d0; --green-deep: #0f7a36; --on-green: #052e16;
      --yellow-soft: #3a3410;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
      color-scheme: dark;
    }
  }
  /* Dark picked with the landing page's theme button, whatever the system says. */
  :root[data-theme="dark"] {
    --bg: #0d1412; --bg-alt: #111c18; --card: #16221e; --fg: #ecf3ef; --muted: #9fb0a8;
    --line: #24332d; --green: #4ade80; --green-soft: #173726; --green-ink: #bbf7d0; --green-deep: #0f7a36; --on-green: #052e16;
    --yellow-soft: #3a3410;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    color-scheme: dark;
  }
  /* vision: start (identical in site/index.html, site/legal.html and site/grupo.html; test/site.test.js checks).
     Two modes the vision button cycles through, on top of light/dark:
     cb = colour-blind safe (Okabe-Ito blue and orange instead of green and yellow),
     hc = high contrast (pure black and white, strong borders, underlined links). */
  :root[data-vision="cb"] { --green: #0072b2; --green-soft: #dcecf8; --green-ink: #00314f; --green-deep: #004a73; --body: #0072b2;
    --band: #00314f; --band-tag: #0072b2; --band-tag-fg: #fff; --yellow: #e69f00; --pink: #cc79a7; --blue: #56b4e9; }
  :root[data-vision="cb"][data-theme="dark"] { --green: #56b4e9; --green-soft: #0f2f45; --green-ink: #cfe9fa; --green-deep: #2f7fae;
    --on-green: #04202f; --band: #0f2f45; --band-tag: #1c5a82; --band-tag-fg: #e0f2fe; }
  @media (prefers-color-scheme: dark) {
    :root[data-vision="cb"]:not([data-theme="light"]) { --green: #56b4e9; --green-soft: #0f2f45; --green-ink: #cfe9fa; --green-deep: #2f7fae;
      --on-green: #04202f; --band: #0f2f45; --band-tag: #1c5a82; --band-tag-fg: #e0f2fe; }
  }
  :root[data-vision="hc"] { --bg: #fff; --bg-alt: #fff; --card: #fff; --fg: #000; --muted: #1f2933; --line: #000; --shadow: none;
    --green: #005a1f; --green-soft: #e6f4ea; --green-ink: #00330f; --green-deep: #00330f;
    --band: #00260b; --band-fg: #fff; --band-tag: #fff; --band-tag-fg: #00260b; }
  :root[data-vision="hc"][data-theme="dark"] { --bg: #000; --bg-alt: #000; --card: #000; --fg: #fff; --muted: #e8e8e8; --line: #fff;
    --green: #7dffa6; --green-soft: #00260b; --green-ink: #d6ffe4; --green-deep: #3ccf72; --on-green: #00200a;
    --band: #000; --band-fg: #fff; --band-tag: #7dffa6; --band-tag-fg: #00200a; }
  @media (prefers-color-scheme: dark) {
    :root[data-vision="hc"]:not([data-theme="light"]) { --bg: #000; --bg-alt: #000; --card: #000; --fg: #fff; --muted: #e8e8e8; --line: #fff;
      --green: #7dffa6; --green-soft: #00260b; --green-ink: #d6ffe4; --green-deep: #3ccf72; --on-green: #00200a;
      --band: #000; --band-fg: #fff; --band-tag: #7dffa6; --band-tag-fg: #00200a; }
  }
  :root[data-vision="hc"] :is(p, li, summary, footer, .lead) a { text-decoration: underline; }
  :root[data-vision="hc"] :focus-visible { outline-width: 4px; }
  @media (forced-colors: active) {
    .btn, .links .go, .cta a, .theme, .vision { border: 2px solid ButtonText; }
  }
  /* vision: end */

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 18px/1.6 var(--font); overflow-x: hidden; }
  a { color: var(--green); }
  :focus-visible { outline: 3px solid var(--green-ink); outline-offset: 2px; }
  .skip { position: absolute; left: 12px; top: -80px; z-index: 30; background: var(--card); color: var(--fg); font-weight: 800;
    padding: 10px 18px; border-radius: 999px; box-shadow: var(--shadow); }
  .skip:focus { top: 8px; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px; }
  h1, h2 { line-height: 1.15; margin: 0; letter-spacing: -.01em; }
  h1 { font-size: clamp(34px, 5.6vw, 52px); font-weight: 900; margin-bottom: .4em; }
  p { margin: 0; }
  .hl { background: linear-gradient(transparent 60%, var(--yellow) 60%); padding: 0 .1em; color: inherit; }
  :root[data-theme="dark"] .hl { background: linear-gradient(transparent 62%, rgba(250,204,21,.45) 62%); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .hl { background: linear-gradient(transparent 62%, rgba(250,204,21,.45) 62%); } }

  header { border-bottom: 1px solid var(--line); }
  .bar { display: flex; align-items: center; justify-content: space-between; height: 64px; gap: 12px; }
  .logo { display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 24px; color: var(--fg); text-decoration: none; }
  .logo svg { width: 42px; height: 42px; }
  .langs { display: flex; gap: 6px; }
  .langs a { border: 2px solid transparent; background: var(--card); border-radius: 999px; padding: 5px 12px; box-shadow: var(--shadow);
    font: 700 14px var(--font); color: var(--fg); text-decoration: none; }
  .langs a[aria-current="page"] { border-color: var(--green); }

  /* Hero: ohmi, its speech bubble and what the page is. */
  .hero { padding: 48px 0 56px; overflow: hidden; }
  .hero-grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 40px; align-items: center; }
  .eyebrow { display: inline-block; font-size: 14px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase;
    color: var(--green-ink); background: var(--green-soft); padding: 4px 12px; border-radius: 999px; margin-bottom: 14px; }
  .lead { font-size: clamp(19px, 2.4vw, 21px); color: var(--muted); max-width: 36em; }
  .stage { position: relative; display: grid; place-items: center; min-height: 340px; padding-top: 64px; }
  .stage::before { content: ""; position: absolute; top: 64px; width: min(94%, 290px); aspect-ratio: 1; border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, var(--yellow-soft), var(--green-soft) 70%); }
  .mascot { position: relative; width: min(220px, 60vw); aspect-ratio: 260 / 300; animation: bob 3.2s ease-in-out infinite;
    filter: drop-shadow(0 18px 18px rgba(15,23,42,.15)); }
  .arm-wave { transform-origin: 196px 150px; animation: wave 1.6s ease-in-out infinite; }
  .blink { transform-origin: center 118px; animation: blink 4.5s infinite; }
  .bubble-hi { position: absolute; top: 0; right: 0; max-width: 15em; background: var(--card); border-radius: 18px 18px 4px 18px; padding: 8px 14px;
    font-weight: 900; box-shadow: var(--shadow); animation: pop 3.2s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-12px) } }
  @keyframes wave { 0%,100% { transform: rotate(0) } 50% { transform: rotate(-22deg) } }
  @keyframes blink { 0%,92%,100% { transform: scaleY(1) } 95% { transform: scaleY(.1) } }
  @keyframes pop { 0%,100% { transform: scale(1) } 50% { transform: scale(1.06) } }

  /* The sites: each one's mascot in a soft circle of its colour, beside a speech bubble, alternating sides.
     --c is that site's colour, only for the circle and the dot: the text keeps this page's colours. */
  .alt { background: var(--bg-alt); padding: 64px 0 72px; }
  .m-carro { --c: #ff6b4a; } .m-ohmigo { --c: #22c55e; } .m-voltaria { --c: #2f5bd0; }
  .m-ceme { --c: #db2777; } .m-nap { --c: #0284c7; } .m-ampere { --c: #8b5cf6; }
  .m-oop { --c: #f2b33d; } .m-pano { --c: #8f2a85; }
  .mates { list-style: none; margin: 0 auto; padding: 0; max-width: 960px; display: flex; flex-direction: column; gap: 44px; }
  .mate { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 30px; align-items: center; max-width: 860px; }
  .mate:nth-child(even) { grid-template-columns: minmax(0, 1fr) 190px; margin-left: auto; }
  .mate:nth-child(even) .mate-pic { order: 2; }
  .mate-pic { position: relative; display: grid; place-items: center; aspect-ratio: 1; }
  .mate-pic::before { content: ""; position: absolute; inset: 4%; border-radius: 50%; background: color-mix(in srgb, var(--c) 22%, var(--bg)); }
  .mate-pic img { position: relative; width: 76%; height: auto; max-height: 86%; object-fit: contain; animation: bob 3.4s ease-in-out infinite;
    filter: drop-shadow(0 12px 12px rgba(15, 23, 42, .16)); }
  .mate:nth-child(2n) .mate-pic img { animation-delay: -1.1s; } .mate:nth-child(3n) .mate-pic img { animation-delay: -2.2s; }
  .mate-bubble { position: relative; background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 24px 26px;
    display: flex; flex-direction: column; gap: 10px; }
  /* The bubble's tail, pointing at the mascot. */
  .mate-bubble::before { content: ""; position: absolute; top: 50%; left: -17px; width: 18px; height: 30px; margin-top: -15px; background: var(--card);
    clip-path: polygon(100% 0, 0 50%, 100% 100%); }
  .mate:nth-child(even) .mate-bubble::before { left: auto; right: -17px; clip-path: polygon(0 0, 100% 50%, 0 100%); }
  .mate-bubble h2 { font-size: clamp(26px, 3.2vw, 32px); font-weight: 900; }
  .mate-host { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 800; color: var(--muted); overflow-wrap: anywhere; }
  .mate-host::before { content: ""; flex: none; width: 11px; height: 11px; border-radius: 50%; background: var(--c); }
  .mate-note { font-size: 16px; color: var(--muted); font-weight: 700; }
  .mate-links { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 6px; }
  .btn { display: inline-flex; align-items: center; gap: 8px; justify-content: center; min-height: 46px; padding: 10px 20px; border-radius: 999px;
    font: 800 16px var(--font); text-decoration: none; transition: transform .15s ease; }
  .btn:active { transform: scale(.97); }
  .btn-main { background: var(--green); color: var(--on-green); box-shadow: 0 4px 0 var(--green-deep); }
  .btn-main:hover { transform: translateY(-2px); }
  .btn-line { background: var(--card); color: var(--fg); box-shadow: inset 0 0 0 2px var(--line); }
  .btn-line:hover { box-shadow: inset 0 0 0 2px var(--green); }
  .btn-line svg { width: 18px; height: 18px; flex: none; }
  .here { display: inline-flex; align-items: center; min-height: 46px; padding: 0 18px; border-radius: 999px; font-weight: 900; font-size: 16px;
    background: var(--green-soft); color: var(--green-ink); }
  :root[data-vision="hc"] .mate-bubble { border: 2px solid var(--line); }
  :root[data-vision="hc"] .mate-bubble::before, :root[data-vision="hc"] .mate-pic::before { display: none; }
  :root[data-vision="hc"] .btn-line { box-shadow: inset 0 0 0 2px var(--fg); }
  @media (forced-colors: active) {
    .mate-bubble, .here { border: 2px solid CanvasText; }
    .mate-bubble::before { display: none; }
  }

  footer { padding: 36px 0 48px; font-size: 15px; color: var(--muted); border-top: 1px solid var(--line); }
  footer a { display: inline-block; margin-right: 14px; white-space: nowrap; }

  @media (max-width: 760px) {
    body { font-size: 17px; }
    .hero { padding: 24px 0 44px; }
    .hero-grid { grid-template-columns: minmax(0, 1fr); gap: 8px; }
    .stage { order: -1; min-height: 230px; padding-top: 52px; }
    .stage::before { top: 52px; }
    .stage::before { width: min(88%, 220px); }
    .mascot { width: min(160px, 46vw); }
    .alt { padding: 44px 0 56px; }
  }
  @media (max-width: 720px) {
    .mates { gap: 36px; }
    .mate, .mate:nth-child(even) { grid-template-columns: minmax(0, 1fr); gap: 4px; margin-left: 0; }
    .mate .mate-pic, .mate:nth-child(even) .mate-pic { order: 0; width: 150px; margin: 0 auto; }
    .mate-bubble::before, .mate:nth-child(even) .mate-bubble::before { top: -17px; left: 50%; right: auto; width: 30px; height: 18px; margin: 0 0 0 -15px;
      clip-path: polygon(0 100%, 50% 0, 100% 100%); }
    .mate-bubble { padding: 22px 20px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
