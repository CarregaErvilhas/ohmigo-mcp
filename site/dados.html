<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dados ohmigo</title>
<meta name="robots" content="noindex, nofollow">
<style>
  /* Uma página para ler o que o MCP sabe, não um painel. */
  :root { --bg:#fff; --fg:#1b1b1b; --mut:#5f6368; --line:#d4d4d4; --soft:rgba(0,0,0,.035); --acc:#16a34a; --warn:#b45309; --bad:#b91c1c; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141414; --fg:#e8e8e8; --mut:#9aa0a6; --line:#3a3a3a; --soft:rgba(255,255,255,.05); --acc:#4ade80; --warn:#f59e0b; --bad:#f87171; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif; }
  header { padding:14px 16px 0; }
  h1 { font-size:1.25rem; margin:0 0 4px; }
  .meta { color:var(--mut); font-size:.85rem; margin:0 0 10px; }
  nav { display:flex; gap:4px; flex-wrap:wrap; border-bottom:1px solid var(--line); }
  nav button { background:none; border:0; border-bottom:2px solid transparent; color:var(--mut); padding:8px 10px; font:inherit; cursor:pointer; }
  nav button.on { color:var(--fg); border-color:var(--acc); font-weight:600; }
  nav .n { font-size:.75rem; color:var(--mut); margin-left:3px; }
  main { padding:12px 16px 40px; }
  .bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:10px; }
  input[type=search] { font:inherit; padding:6px 9px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); min-width:260px; }
  label { color:var(--mut); font-size:.85rem; }
  table { width:100%; border-collapse:collapse; font-size:.85rem; font-variant-numeric:tabular-nums; }
  th, td { border:1px solid var(--line); padding:3px 7px; text-align:left; vertical-align:top; white-space:nowrap; }
  td.wrap-ok { white-space:normal; min-width:320px; }
  th { font-weight:600; background:var(--soft); position:sticky; top:0; }
  td.num, th.num { text-align:right; white-space:nowrap; }
  td.nw { white-space:nowrap; }
  tr.sub td { background:var(--soft); }
  .tag { display:inline-block; font-size:.72rem; padding:0 5px; border-radius:4px; border:1px solid var(--line); color:var(--mut); margin:0 2px 2px 0; white-space:nowrap; }
  .tag.ok { color:var(--acc); border-color:var(--acc); }
  .tag.warn { color:var(--warn); border-color:var(--warn); }
  .tag.bad { color:var(--bad); border-color:var(--bad); }
  a { color:var(--acc); }
  .mut { color:var(--mut); }
  .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:10px; margin-bottom:16px; }
  .card { border:1px solid var(--line); border-radius:8px; padding:10px 12px; }
  .card b { display:block; font-size:1.4rem; }
  .card span { color:var(--mut); font-size:.82rem; }
  ul.plans { margin:0; padding-left:16px; }
  button.lnk { background:none; border:0; color:var(--acc); cursor:pointer; padding:0; font:inherit; text-decoration:underline; }
  pre { white-space:pre-wrap; font-size:.8rem; margin:0; }
  .err { color:var(--bad); }
  h2 { font-size:1rem; margin:18px 0 6px; }
  p.help { color:var(--mut); font-size:.85rem; margin:0 0 10px; max-width:900px; }
</style>
</head>
<body>
<header>
  <h1>O que o ohmigo está a servir</h1>
  <p class="meta" id="meta">A carregar…</p>
  <nav id="tabs"></nav>
</header>
<main id="app"></main>
<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const eur = (v, d = 4) => v == null ? '' : Number(v).toLocaleString('pt-PT', { minimumFractionDigits: 2, maximumFractionDigits: d });
const tag = (txt, cls = '') => `<span class="tag ${cls}">${esc(txt)}</span>`;
const fold = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const PERIODS = ['VAZIO', 'FORA_VAZIO', 'CHEIAS', 'PONTA', 'SIMPLES'];
const REGIME = { mobie: 'MOBI.E', mobie_sem_tarifa: 'MOBI.E sem tarifa OPC', sem_ceme: 'fora MOBI.E' };
let D, tab = location.hash.slice(1) || 'resumo', q = '';
const opOpen = new Map(); // operator key -> chargers (loaded on demand)

// Each tab: count for the nav, and a render(filter) that returns HTML.
const TABS = {
  resumo: { label: 'Resumo', render: resumo },
  tarifarios: { label: 'Tarifários CEME', n: () => D.ceme.tariffs?.length, render: tarifarios },
  promos: { label: 'Promoções CEME', n: () => D.promos.length, render: promos },
  ofertas: { label: 'Ofertas diretas', n: () => D.offers.list.length, render: ofertas },
  operadores: { label: 'Operadores e postos', n: () => D.operators.length, render: operadores },
  notas: { label: 'Notas NAP e redes', n: () => D.napNotes.length + Object.keys(D.networks).length, render: notas },
};

function nav() {
  $('#tabs').innerHTML = Object.entries(TABS).map(([k, t]) =>
    `<button data-t="${k}" class="${k === tab ? 'on' : ''}">${t.label}${t.n ? `<span class="n">${t.n() ?? '–'}</span>` : ''}</button>`).join('');
}
function draw() {
  nav();
  const search = tab === 'resumo' ? '' : `<div class="bar"><input type="search" id="q" placeholder="Filtrar…" value="${esc(q)}"><label id="shown"></label></div>`;
  $('#app').innerHTML = search + TABS[tab].render(fold(q));
  const i = $('#q'); if (i) { i.focus(); i.setSelectionRange(q.length, q.length); }
}
const match = (f, ...xs) => !f || xs.some(x => fold(x).includes(f));
const shown = (n, total) => queueMicrotask(() => { const l = $('#shown'); if (l) l.textContent = `${n} de ${total}`; });

function resumo() {
  const c = D.counts, r = c.regimes, ce = D.ceme;
  const stale = D.offers.list.filter(o => o.stale).length;
  const card = (b, s) => `<div class="card"><b>${b}</b><span>${s}</span></div>`;
  return `<div class="cards">
    ${card(c.sites.toLocaleString('pt-PT'), 'locais (sites) no dataset')}
    ${card(c.points.toLocaleString('pt-PT'), 'tomadas (points)')}
    ${card((r.mobie || 0).toLocaleString('pt-PT'), 'MOBI.E com tarifa OPC')}
    ${card((r.mobie_sem_tarifa || 0).toLocaleString('pt-PT'), 'MOBI.E sem tarifa OPC publicada')}
    ${card((r.sem_ceme || 0).toLocaleString('pt-PT'), 'fora MOBI.E (preço do NAP)')}
    ${card(ce.tariffs?.length ?? '<span class=err>erro</span>', 'tarifários CEME (ceme-v2)')}
    ${card(Array.isArray(D.promos) ? D.promos.length : '<span class=err>erro</span>', 'promoções CEME (ceme-v2)')}
    ${card(D.offers.list.length, `ofertas diretas${stale ? ` · <span style="color:var(--warn)">${stale} desatualizadas</span>` : ''}`)}
    ${card(D.operators.length, 'operadores (OPC) no NAP')}
  </div>
  <h2>De onde vem cada coisa</h2>
  <table>
    <tr><th>Dado</th><th>Fonte</th><th>Atualizado</th></tr>
    <tr><td>Postos, tomadas, tarifas OPC, preço NAP</td><td>dataset do nap-dashboard (<code>chargers.json</code>)</td><td class="nw">${esc(D.dataAsOf)}</td></tr>
    <tr><td>Tarifários e promoções CEME</td><td>API ceme-v2 (<code>/v1/simulate</code>, <code>/v1/promos</code>)</td><td class="nw">ao vivo, cache 5 min</td></tr>
    <tr><td>Ofertas diretas (app/subscrição/TPA)</td><td><a href="${esc(D.offers.source.post)}">custofinal.blogspot.com</a> + <code>offers/manual.json</code></td><td class="nw">${esc(D.offers.source.published?.slice(0, 10))}</td></tr>
    <tr><td>Correções ao preço do NAP</td><td><code>offers/nap-notes.json</code></td><td class="nw">manual</td></tr>
    <tr><td>Rede → operadores</td><td><code>offers/networks.json</code></td><td class="nw">manual</td></tr>
  </table>
  ${ce.error ? `<p class="err">ceme-v2 falhou: ${esc(ce.error)}</p>` : ''}
  ${D.offers.orphans?.length ? `<h2>manual.json órfãos</h2><ul>${D.offers.orphans.map(o => `<li>${esc(o)}</li>`).join('')}</ul>` : ''}`;
}

function tarifarios(f) {
  if (D.ceme.error) return `<p class="err">${esc(D.ceme.error)}</p>`;
  const all = D.ceme.tariffs;
  const rows = all.filter(t => match(f, t.ceme, t.name, t.id, t.kind));
  shown(rows.length, all.length);
  const per = PERIODS.filter(p => all.some(t => t.prices?.[p] != null));
  return `<p class="help">Os tarifários que o ceme-v2 devolve ao ohmigo (${esc(D.ceme.region)}), por CEME. Preços por período: energia+TAR sem IVA, €/kWh. Os indexados seguem o OMIE de cada quarto de hora, por isso não têm preço fixo aqui: as tools pedem-no ao ceme-v2 para a hora da sessão.</p>
  <table>
    <tr><th>CEME</th><th>Tarifário</th><th>Tipo</th><th>Tensão</th><th>Horário</th>${per.map(p => `<th class="num">${p.replace('_', ' ').toLowerCase()}</th>`).join('')}<th class="num">Ativação €</th><th>Promos</th><th>Flags</th></tr>
    ${rows.map(t => `<tr>
      <td class="nw">${esc(t.ceme)}</td>
      <td>${t.url ? `<a href="${esc(t.url)}" target="_blank" rel="noopener">${esc(t.name)}</a>` : esc(t.name)}<div class="mut" style="font-size:.75rem">${esc(t.id)}${t.legacyId ? ` · #${t.legacyId}` : ''} · desde ${esc(t.validFrom)}</div></td>
      <td>${esc(t.kind)}</td><td>${esc(t.voltage)}</td><td class="nw">${esc(t.schedule)}<div class="mut" style="font-size:.75rem">${esc(t.cycle)}</div></td>
      ${t.prices ? per.map(p => `<td class="num">${eur(t.prices[p])}</td>`).join('') : `<td colspan="${per.length}">${tag('indexado OMIE', 'warn')}</td>`}
      <td class="num">${eur(t.activation)}</td>
      <td>${t.promos.map(p => tag(p, 'ok')).join('')}</td>
      <td>${t.popular ? tag('popular') : ''}${t.bundle ? tag('exige outro contrato', 'warn') : ''}${t.estimated ? tag('estimado', 'warn') : ''}${t.notes ? tag(t.notes) : ''}</td>
    </tr>`).join('')}
  </table>`;
}

const TARGET = { ENERGIA: 'desconto energia', OPC: '% sobre tarifa OPC', FINAL: 'preço final', KWH_GRATIS: 'kWh grátis/mês' };
function promos(f) {
  if (!Array.isArray(D.promos)) return `<p class="err">${esc(D.promos.error)}</p>`;
  const rows = D.promos.filter(p => match(f, p.ceme, p.name, p.network, p.id));
  shown(rows.length, D.promos.length);
  return `<p class="help">Promoções que o ceme-v2 ainda não deu por terminadas. "Rede" é a label que <code>networks.json</code> mapeia para operadores; uma label desconhecida não aplica em lado nenhum.</p>
  <table>
    <tr><th>CEME</th><th>Promoção</th><th>Rede</th><th>Tipo</th><th class="num">Valor</th><th>Período</th><th>Estado</th><th>Tarifários</th></tr>
    ${rows.map(p => {
      const net = p.network == null ? tag('qualquer MOBI.E') : D.networks[p.network] ? tag(p.network) : tag(p.network + ' (sem mapa!)', 'bad');
      const v = p.target === 'OPC' ? `${p.pct} %` : p.target === 'KWH_GRATIS' ? `${p.freeKwh} kWh` : `${eur(p.eurKwh)} €/kWh`;
      return `<tr><td class="nw">${esc(p.ceme)}</td><td>${p.url ? `<a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.name)}</a>` : esc(p.name)}<div class="mut" style="font-size:.75rem">${esc(p.id)} · verificado ${esc(p.checked)}</div></td>
      <td>${net}</td><td>${esc(TARGET[p.target] ?? p.target)}</td><td class="num">${v}</td><td class="nw">${esc(p.from)} → ${esc(p.to ?? '…')}</td>
      <td>${p.active ? tag('ativa', 'ok') : tag('futura', 'warn')}${p.newCustomers ? tag('só novos clientes', 'warn') : ''}${p.maxHours ? tag(`máx ${p.maxHours} h`) : ''}</td>
      <td>${(p.tariffs || []).map(t => tag(t)).join('')}</td></tr>`;
    }).join('')}
  </table>`;
}

const BANDS = ['ac7', 'ac22', 'dc50', 'dc100', 'dc120', 'dc150', 'dc180', 'dcMax', 'all'];
function ofertas(f) {
  const all = D.offers.list;
  const rows = all.filter(o => match(f, o.label, o.provider, o.network, o.id));
  shown(rows.length, all.length);
  const bands = BANDS.filter(b => all.some(o => o.prices?.[b] != null));
  const scope = o => o.scope.mobie ? tag('toda a MOBI.E') : o.scope.operatorIds ? o.scope.operatorIds.map(x => tag(x)).join('') : tag('?', 'bad');
  return `<p class="help">Preços pagos fora do CEME (app do operador, subscrição, TPA, roaming), €/kWh com IVA, por escalão de potência. Origem "custofinal" = scrape semanal; "manual" = <code>manual.json</code> ganha. Desatualizada = verificada há mais de 90 dias.</p>
  <table>
    <tr><th>Oferta</th><th>Rede</th><th>Aplica a</th>${bands.map(b => `<th class="num">${b}</th>`).join('')}<th class="num">Mensalidade</th><th>Flags</th><th>Verificado</th></tr>
    ${rows.map(o => `<tr>
      <td>${esc(o.label)}<div class="mut" style="font-size:.75rem">${esc(o.id)}</div></td><td class="nw">${esc(o.network)}</td><td>${scope(o)}</td>
      ${bands.map(b => `<td class="num">${eur(o.prices?.[b])}</td>`).join('')}
      <td class="num">${o.fee ? `${eur(o.fee.eur, 2)} €/${o.fee.per === 'month' ? 'mês' : o.fee.per === 'year' ? 'ano' : esc(o.fee.per)}` : ''}</td>
      <td>${tag(o.origin, o.origin === 'manual' ? 'warn' : '')}${o.walkUp ? tag('walk-up/TPA', 'ok') : ''}${o.subscription ? tag('subscrição') : ''}${o.stale ? tag('desatualizada', 'bad') : ''}</td>
      <td class="nw"><a href="${esc(o.source)}" target="_blank" rel="noopener">${esc(o.checkedAt)}</a></td>
    </tr>`).join('')}
  </table>`;
}

function operadores(f) {
  const all = D.operators;
  const rows = all.filter(o => match(f, o.name, o.id));
  shown(rows.length, all.length);
  const reg = o => Object.entries(o.regimes).map(([k, n]) => tag(`${REGIME[k] ?? k}: ${n}`, k === 'sem_ceme' ? 'warn' : k === 'mobie_sem_tarifa' ? 'bad' : '')).join('');
  const plans = (xs, max = 3) => xs.length ? `<ul class="plans">${xs.slice(0, max).map(p => `<li>${esc(p.desc)} <span class="mut">×${p.n}</span></li>`).join('')}${xs.length > max ? `<li class="mut">+${xs.length - max} outras</li>` : ''}</ul>` : '<span class="mut">—</span>';
  return `<p class="help">Uma linha por operador (OPC) do NAP. Tarifa OPC = o que o MOBI.E publica para a tomada (sem IVA), agrupada; ×N = tomadas com esse plano. Ad hoc = preço MOBI.E sem cartão CEME. Preço NAP = o que o NAP publica para postos fora da MOBI.E. Clica "postos" para ver tomada a tomada.</p>
  <table>
    <tr><th>Operador</th><th class="num">Locais</th><th class="num">Tomadas</th><th class="num">DC</th><th class="num">Máx kW</th><th>Regime</th><th>Tarifa OPC (top 3)</th><th>Ad hoc</th><th class="num">Preço NAP €/kWh</th><th>Ofertas / notas</th><th></th></tr>
    ${rows.map(o => `<tr>
      <td>${esc(o.name)}<div class="mut" style="font-size:.75rem">${esc(o.id)}${o.website ? ` · <a href="${esc(o.website)}" target="_blank" rel="noopener">site</a>` : ''}</div></td>
      <td class="num">${o.sites}</td><td class="num">${o.points}</td><td class="num">${o.dc}</td><td class="num">${o.maxKw}</td>
      <td>${reg(o)}</td><td>${plans(o.plans)}</td><td>${plans(o.adhoc, 2)}</td>
      <td class="num">${o.napPrice ? (o.napPrice.min === o.napPrice.max ? eur(o.napPrice.min) : `${eur(o.napPrice.min)}–${eur(o.napPrice.max)}`) : ''}</td>
      <td>${o.offers.map(x => tag(x, 'ok')).join('')}${o.note ? tag('nota NAP', 'warn') : ''}${o.inferred ? tag(`${o.inferred} locais sem operador no NAP, atribuídos pelo prefixo do id`, 'warn') : ''}</td>
      <td><button class="lnk" data-op="${esc(o.key)}">${opOpen.has(o.key) ? 'fechar' : 'postos'}</button></td>
    </tr>${opOpen.has(o.key) ? `<tr class="sub"><td colspan="11">${postos(opOpen.get(o.key))}</td></tr>` : ''}`).join('')}
  </table>`;
}

function postos(sites) {
  if (!sites) return 'A carregar…';
  // One row per site and distinct socket setup: most sites have N identical
  // sockets, and the ids (Tesla's are UUIDs) say nothing to a person.
  const rows = sites.flatMap(s => {
    const groups = new Map();
    for (const p of s.points) {
      const k = JSON.stringify([p.kw, p.connector, p.dc, p.level, p.regime, p.opc, p.adhoc, p.napPrice, p.offers]);
      const g = groups.get(k) ?? { p, ids: [] };
      g.ids.push(p.id); groups.set(k, g);
    }
    return [...groups.values()].map((g, i) => ({ s, first: i === 0, span: groups.size, ...g }));
  });
  const max = 400;
  return `<div class="wrap" style="max-height:560px;overflow:auto"><table>
    <tr><th>Local</th><th class="num">Tomadas</th><th class="num">kW</th><th>Ficha</th><th>Nível</th><th>Regime</th><th>Tarifa OPC</th><th>Ad hoc</th><th class="num">NAP €/kWh</th><th>Ofertas diretas aqui (€/kWh)</th></tr>
    ${rows.slice(0, max).map(({ s, first, span, p, ids }) => `<tr>
      ${first ? `<td class="wrap-ok" rowspan="${span}"><b>${esc(s.name ?? s.city)}</b> <span class="mut">${esc(s.name ? s.city : '')}</span><div class="mut" style="font-size:.75rem">${esc(s.address)} · ${esc(s.code.length > 16 ? s.code.slice(0, 8) + '…' : s.code)}</div></td>` : ''}
      <td class="num" title="${esc(ids.join(', '))}">${ids.length}×</td><td class="num">${p.kw}</td><td>${esc(p.connector)}${p.dc ? ' DC' : ''}</td><td>${esc(p.level ?? '')}</td>
      <td>${esc(REGIME[p.regime] ?? p.regime)}</td><td>${esc(p.opc ?? '')}</td><td>${esc(p.adhoc ?? '')}</td><td class="num">${eur(p.napPrice)}</td>
      <td>${p.offers.map(x => `<span class="tag" title="${esc(x.id)}">${esc(x.label)}: ${eur(x.eurPerKwh)}</span>`).join('')}</td>
    </tr>`).join('')}
  </table>${rows.length > max ? `<p class="mut">A mostrar ${max} de ${rows.length} linhas; filtra por operador mais pequeno ou abre outro.</p>` : ''}</div>`;
}

function notas(f) {
  const nets = Object.entries(D.networks).filter(([k, v]) => match(f, k, ...(v.operatorIds || [])));
  return `<h2>Notas sobre o preço do NAP (<code>nap-notes.json</code>)</h2>
  <table><tr><th>Âmbito</th><th>Flags</th><th>Porquê</th><th>Verificado</th></tr>
  ${D.napNotes.map(n => `<tr><td>${[...(n.scope.operatorIds || []), ...(n.scope.siteIds || [])].map(x => tag(x)).join('')}</td>
    <td>${n.vatIncluded ? tag('IVA incluído') : ''}${n.timeOfUse ? tag('varia com a hora', 'warn') : ''}${n.walkUp ? tag('TPA mesmo preço', 'ok') : ''}${!n.vatIncluded && !n.timeOfUse ? tag('preço ignorado', 'bad') : ''}</td>
    <td class="wrap-ok" style="max-width:700px">${esc(n.why)}</td><td class="nw"><a href="${esc(n.source)}" target="_blank" rel="noopener">${esc(n.checkedAt)}</a></td></tr>`).join('')}
  </table>
  <h2>Redes → operadores (<code>networks.json</code>)</h2>
  <table><tr><th>Label</th><th>Operadores NAP</th><th>Nota</th></tr>
  ${nets.map(([k, v]) => `<tr><td>${esc(k)}</td><td>${v.scope === 'mobie' ? tag('toda a MOBI.E') : v.scope === 'unknown' ? tag('desconhecido: ignorada', 'bad') : (v.operatorIds || []).map(id => tag(`${id} · ${D.operators.find(o => o.id === id)?.name ?? '?'}`)).join('')}</td><td class="mut">${esc(v.why ?? '')}</td></tr>`).join('')}
  </table>`;
}

document.addEventListener('click', async e => {
  const t = e.target.closest('[data-t]');
  if (t) { tab = t.dataset.t; q = ''; location.hash = tab; return draw(); }
  const b = e.target.closest('[data-op]');
  if (b) {
    const id = b.dataset.op;
    if (opOpen.has(id)) { opOpen.delete(id); return draw(); }
    opOpen.set(id, null); draw();
    const r = await fetch(`/dados/postos.json?op=${encodeURIComponent(id)}`);
    opOpen.set(id, await r.json()); draw();
  }
});
document.addEventListener('input', e => { if (e.target.id === 'q') { q = e.target.value; draw(); } });

fetch('/dados.json').then(r => r.json()).then(d => {
  D = d;
  if (!TABS[tab]) tab = 'resumo';
  $('#meta').textContent = `ohmigo ${d.version} · dataset de ${new Date(d.dataAsOf).toLocaleString('pt-PT')} · gerado ${new Date(d.now).toLocaleString('pt-PT')}`;
  draw();
}).catch(e => { $('#meta').innerHTML = `<span class="err">Falhou: ${esc(e.message)}</span>`; });
</script>
</body>
</html>
